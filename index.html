<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<title>Spindle — MP3 Player</title>
<meta name="theme-color" content="#0A0C10">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="./icon-512.png">
<style>
  /* ---------- Local fonts ---------- */
  @font-face{ font-family:'Clash Display'; src:url('./fonts/ClashDisplay-Variable.woff2') format('woff2'); font-weight:200 700; font-style:normal; font-display:swap; }
  @font-face{ font-family:'Satoshi'; src:url('./fonts/Satoshi-Regular.woff2') format('woff2'); font-weight:400; font-style:normal; font-display:swap; }
  @font-face{ font-family:'Satoshi'; src:url('./fonts/Satoshi-Bold.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
  @font-face{ font-family:'Manrope'; src:url('./fonts/Manrope-Bold.woff2') format('woff2'); font-weight:700; font-style:normal; font-display:swap; }
  :root{
    --font-display:'Clash Display','Satoshi',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-ui:'Satoshi',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-alt:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --font-body:var(--font-ui);
    --bg:#0A0C10;
    --bg-soft:#101319;
    --panel:rgba(255,255,255,0.028);
    --panel-strong:rgba(255,255,255,0.05);
    --border:rgba(255,255,255,0.07);
    --border-soft:rgba(255,255,255,0.06);
    --brass:#C9A15A;
    --brass-soft:#7d6535;
    --brass-glow:rgba(201,161,90,0.35);
    --indigo:#6B5CE0;
    --text:#F2EFE9;
    --text-dim:#9A9CA6;
    --text-faint:#7B7E8A;
    --danger:#E0605C;
    --r-lg:26px;
    --r-md:16px;
    --r-sm:10px;
    --shadow:0 20px 60px -20px rgba(0,0,0,0.7);
  }
  html[data-font="alt"]{ --font-body:var(--font-alt); } /* add data-font="alt" on <html> to test Manrope */
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(1100px 700px at 15% -10%, rgba(107,92,224,0.16), transparent 60%),
      radial-gradient(900px 600px at 110% 10%, rgba(201,161,90,0.10), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    overflow-x:hidden;
  }
  h1,h2,h3,.serif,.track-meta strong,.mini-meta strong,.tp-meta strong,.playlist-card .pinfo strong,.all-songs-card .meta strong{ font-family:var(--font-display); letter-spacing:-0.02em; word-spacing:0.14em; }
  h1,h2,h3{ font-weight:600; }
  ::selection{ background:var(--brass-glow); }
  button{ font-family:inherit; cursor:pointer; }
  [data-action]{ transition:transform .13s cubic-bezier(.4,0,.2,1), background-color .15s ease, opacity .15s ease; -webkit-tap-highlight-color:transparent; }
  [data-action]:active{ transform:scale(0.96); }
  input, select{ font-family:inherit; }
  a{ color:inherit; }
  ::-webkit-scrollbar{ width:6px; height:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.12); border-radius:4px; }

  #app{ max-width:560px; margin:0 auto; min-height:100vh; position:relative; z-index:2; padding-bottom:110px; view-transition-name:app-content; }

  /* ---------- Screen transitions ---------- */
  ::view-transition-old(app-content), ::view-transition-new(app-content){
    animation-duration:.36s; animation-timing-function:cubic-bezier(.4,0,.2,1);
  }
  html[data-nav-dir="forward"]::view-transition-old(app-content){ animation-name:vt-fade-shrink; }
  html[data-nav-dir="forward"]::view-transition-new(app-content){ animation-name:vt-slide-in-r; }
  html[data-nav-dir="backward"]::view-transition-old(app-content){ animation-name:vt-slide-out-r; }
  html[data-nav-dir="backward"]::view-transition-new(app-content){ animation-name:vt-fade-grow; }
  @keyframes vt-slide-in-r{ from{ transform:translateX(38px) scale(.98); opacity:0; } to{ transform:translateX(0) scale(1); opacity:1; } }
  @keyframes vt-fade-shrink{ from{ transform:scale(1); opacity:1; } to{ transform:scale(.97); opacity:0; } }
  @keyframes vt-slide-out-r{ from{ transform:translateX(0); opacity:1; } to{ transform:translateX(38px); opacity:0; } }
  @keyframes vt-fade-grow{ from{ transform:scale(1.03); opacity:0; } to{ transform:scale(1); opacity:1; } }

  #app.slide-fwd{ animation:appSlideFwd .34s cubic-bezier(.4,0,.2,1); }
  #app.slide-back{ animation:appSlideBack .34s cubic-bezier(.4,0,.2,1); }
  @keyframes appSlideFwd{ from{ transform:translateX(26px); opacity:0; } to{ transform:translateX(0); opacity:1; } }
  @keyframes appSlideBack{ from{ transform:translateX(-26px); opacity:0; } to{ transform:translateX(0); opacity:1; } }

  /* ---------- Living background scenes ---------- */
  #bg-scene-root{ position:fixed; inset:0; z-index:0; overflow:hidden; background:var(--bg); }
  .bg-scene{ position:absolute; inset:0; opacity:0; transition:opacity 3.2s ease; overflow:hidden; }
  .bg-scene.active{ opacity:1; }
  #bg-stock{ position:fixed; inset:0; z-index:0; background:#000 center/cover no-repeat; overflow:hidden; display:none; }
  #bg-custom video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; pointer-events:none; }
  #bg-stock video{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; pointer-events:none; }
  html[data-bg="stock"] #bg-scrim{ background:linear-gradient(180deg, rgba(5,6,10,0.42) 0%, rgba(5,6,10,0.50) 35%, rgba(5,6,10,0.66) 70%, rgba(5,6,10,0.82) 100%); }
  #bg-custom{ position:fixed; inset:0; z-index:0; background-color:var(--bg); background-size:cover; background-position:center; }
  #bg-scrim{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(5,6,10,0.30) 0%, rgba(5,6,10,0.38) 35%, rgba(5,6,10,0.56) 70%, rgba(5,6,10,0.74) 100%); }

  .scene-sky{ position:absolute; inset:0; }
  .scene-sun{ position:absolute; border-radius:50%; z-index:2; }
  .scene-glow{ position:absolute; border-radius:50%; filter:blur(4px); }
  .scene-haze{ position:absolute; left:0; right:0; bottom:0; }
  .scene-cloud{ position:absolute; border-radius:50%; filter:blur(18px); }
  .scene-mtn{ position:absolute; left:-8%; right:-8%; bottom:0; }
  .scene-mist{ position:absolute; left:0; right:0; bottom:0; filter:blur(14px); }
  .scene-stars{ position:absolute; inset:0; }
  .scene-stars span{ position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:.7; animation:twinkle 3.4s ease-in-out infinite; }
  @keyframes twinkle{ 0%,100%{ opacity:.25; transform:scale(.8); } 50%{ opacity:.9; transform:scale(1.15); } }
  .scene-flakes{ position:absolute; inset:0; overflow:hidden; }
  .scene-flakes span{ position:absolute; top:-5%; border-radius:50%; background:rgba(255,255,255,0.85); animation:snowfall linear infinite; }
  @keyframes snowfall{ from{ transform:translateY(-10vh) translateX(0) rotate(0deg); } to{ transform:translateY(112vh) translateX(18px) rotate(90deg); } }
  .scene-birds{ position:absolute; inset:0; }
  .scene-birds span{ position:absolute; width:16px; height:7px; opacity:.5; }
  .scene-birds span::before, .scene-birds span::after{ content:''; position:absolute; top:0; width:9px; height:2px; background:#2a1830; border-radius:2px; }
  .scene-birds span::before{ left:0; transform:rotate(22deg); transform-origin:right center; }
  .scene-birds span::after{ right:0; transform:rotate(-22deg); transform-origin:left center; }

  /* Sunset */
  .scene-sunset .scene-sky{ background:linear-gradient(180deg,#1c0f38 0%,#4a1f4d 20%,#8c2f56 38%,#c94a52 52%,#e97a45 64%,#f6a24f 74%,#ffce85 85%,#ffe9c2 94%,#fff3d9 100%); }
  .scene-sunset .scene-glow{ width:44vw; height:44vw; left:50%; top:58%; transform:translate(-50%,-50%); opacity:.7;
    background:radial-gradient(circle, rgba(255,214,140,0.35) 0%, rgba(255,170,90,0.14) 50%, transparent 74%); }
  .scene-sunset .scene-sun{ width:112px; height:112px; left:50%; top:58%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 44% 40%, #fffef8 0%, #fff6da 22%, #ffe19c 42%, #ffbf68 62%, #ff9d4e 80%, #f2843e 92%, #e5742f 100%);
    box-shadow:0 0 34px 8px rgba(255,180,110,0.55), 0 0 90px 30px rgba(255,140,90,0.22); }
  .scene-sunset .scene-haze{ height:16%; background:linear-gradient(180deg, rgba(255,205,140,0.35), rgba(255,205,140,0)); }
  .scene-sunset .scene-cloud{ background:linear-gradient(180deg, rgba(255,205,150,0.4), rgba(180,90,110,0.15)); }
  .scene-sunset .cl1{ width:220px; height:46px; left:6%; top:34%; }
  .scene-sunset .cl2{ width:170px; height:36px; left:58%; top:24%; opacity:.8; }
  .scene-sunset .cl3{ width:140px; height:30px; left:32%; top:44%; opacity:.65; }
  .scene-sunset .scene-mtn.m1{ height:22%; opacity:.55; filter:blur(1.5px);
    clip-path:polygon(0% 100%,0% 72%,16% 58%,32% 68%,48% 54%,64% 66%,80% 56%,92% 64%,100% 58%,100% 100%);
    background:linear-gradient(180deg, rgba(170,120,150,0.65) 0%, rgba(120,85,125,0.55) 100%); }
  .scene-sunset .scene-mtn.m2{ height:30%; opacity:.85;
    clip-path:polygon(0% 100%,0% 62%,9% 42%,19% 56%,29% 30%,40% 50%,50% 24%,61% 46%,71% 28%,82% 48%,92% 34%,100% 52%,100% 100%);
    background:
      linear-gradient(180deg, rgba(255,175,140,0.4) 0%, transparent 16%),
      repeating-linear-gradient(120deg, rgba(255,255,255,0.03) 0 2px, transparent 2px 8px),
      linear-gradient(180deg, #6b3358 0%, #45213f 60%, #2c1530 100%); }
  .scene-sunset .scene-mtn.m3{ height:22%;
    clip-path:polygon(0% 100%,0% 66%,5% 52%,10% 62%,16% 40%,22% 56%,27% 34%,33% 50%,39% 26%,45% 46%,51% 30%,57% 48%,63% 32%,69% 52%,75% 36%,81% 54%,87% 40%,93% 58%,97% 46%,100% 56%,100% 100%);
    background:
      linear-gradient(180deg, rgba(255,190,150,0.5) 0%, transparent 11%),
      repeating-linear-gradient(125deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 7px),
      linear-gradient(180deg, #2a1420 0%, #180b16 55%, #0d0710 100%); }
  .scene-sunset .scene-birds span{ top:30%; }
  .scene-sunset .scene-birds span:nth-child(1){ left:20%; top:26%; }
  .scene-sunset .scene-birds span:nth-child(2){ left:26%; top:31%; width:12px; }
  .scene-sunset .scene-birds span:nth-child(3){ left:68%; top:20%; width:13px; }

  /* Snowy peaks */
  .scene-snow .scene-sky{ background:linear-gradient(180deg,#0a223f 0%,#123a5e 18%,#265a80 36%,#4c86a6 54%,#8fb7cc 70%,#cfe4ee 85%,#eef6fb 96%); }
  .scene-snow .scene-glow{ width:32vw; height:32vw; left:72%; top:20%; transform:translate(-50%,-50%); opacity:.6;
    background:radial-gradient(circle, rgba(230,244,255,0.4) 0%, rgba(200,230,250,0.12) 55%, transparent 75%); }
  .scene-snow .scene-sun{ width:92px; height:92px; left:72%; top:20%; transform:translate(-50%,-50%);
    background:radial-gradient(circle at 42% 38%, #ffffff 0%, #f7fbff 30%, #e3f0fa 52%, #c3ddee 74%, #a9cee6 90%, #97c2de 100%);
    box-shadow:0 0 30px 8px rgba(220,238,252,0.55), 0 0 80px 26px rgba(190,222,245,0.22); }
  .scene-snow .scene-cloud{ background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(210,230,245,0.15)); }
  .scene-snow .cl1{ width:210px; height:50px; left:8%; top:22%; }
  .scene-snow .cl2{ width:150px; height:34px; left:52%; top:38%; opacity:.7; }
  .scene-snow .scene-mtn.m1{ height:24%; opacity:.55; filter:blur(1.5px);
    clip-path:polygon(0% 100%,0% 72%,16% 58%,32% 68%,48% 54%,64% 66%,80% 56%,92% 64%,100% 58%,100% 100%);
    background:linear-gradient(180deg,#f5fafd 0%, #cfe0ec 55%, #a9c3d4 100%); }
  .scene-snow .scene-mtn.m2{ height:32%; opacity:.9;
    clip-path:polygon(0% 100%,0% 62%,9% 42%,19% 56%,29% 30%,40% 50%,50% 24%,61% 46%,71% 28%,82% 48%,92% 34%,100% 52%,100% 100%);
    background:
      linear-gradient(180deg,#ffffff 0%, #eaf3fa 14%, transparent 30%),
      repeating-linear-gradient(120deg, rgba(255,255,255,0.06) 0 2px, transparent 2px 8px),
      linear-gradient(180deg,#c3d8e6 0%, #8fabc0 55%, #5c7891 100%); }
  .scene-snow .scene-mtn.m3{ height:20%;
    clip-path:polygon(0% 100%,0% 66%,5% 52%,10% 62%,16% 40%,22% 56%,27% 34%,33% 50%,39% 26%,45% 46%,51% 30%,57% 48%,63% 32%,69% 52%,75% 36%,81% 54%,87% 40%,93% 58%,97% 46%,100% 56%,100% 100%);
    background:
      linear-gradient(180deg, #ffffff 0%, #eef6fb 10%, transparent 24%),
      repeating-linear-gradient(120deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 7px),
      linear-gradient(180deg, #3a5468 0%, #223345 60%, #16232f 100%); }
  .scene-snow .scene-mist{ height:14%; background:linear-gradient(180deg, rgba(210,228,240,0.55), rgba(210,228,240,0)); opacity:.8; }

  /* Midnight aurora */
  .scene-aurora .scene-sky{ background:linear-gradient(180deg,#03040c 0%,#060a1e 40%,#0a1130 75%,#0c1430 100%); }
  .scene-aurora .scene-moon{ position:absolute; right:16%; top:14%; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #fbfbfa 0%, #eef0ee 35%, #d7dbdc 60%, #b9bfc4 82%, #a2a9b0 100%);
    box-shadow:0 0 24px 6px rgba(220,225,235,0.35), 0 0 60px 18px rgba(180,195,220,0.14); }
  .scene-aurora .scene-moon::after{ content:''; position:absolute; inset:0; border-radius:50%;
    background:
      radial-gradient(circle at 30% 65%, rgba(120,125,130,0.35) 0 7%, transparent 8%),
      radial-gradient(circle at 62% 30%, rgba(120,125,130,0.3) 0 5%, transparent 6%),
      radial-gradient(circle at 70% 68%, rgba(120,125,130,0.25) 0 4%, transparent 5%); }
  .scene-aurora .aurora-band{ position:absolute; left:-10%; right:-10%; height:46%; top:6%; filter:blur(38px); mix-blend-mode:screen; opacity:.55; }
  .scene-aurora .aurora-band.a1{ background:radial-gradient(ellipse 60% 100% at 30% 20%, rgba(107,224,170,0.55), transparent 70%); animation:auroradrift 26s ease-in-out infinite; }
  .scene-aurora .aurora-band.a2{ background:radial-gradient(ellipse 55% 100% at 70% 10%, rgba(107,92,224,0.5), transparent 70%); animation:auroradrift 32s ease-in-out infinite reverse; }
  .scene-aurora .aurora-band.a3{ background:radial-gradient(ellipse 45% 90% at 50% 26%, rgba(220,120,200,0.28), transparent 72%); animation:auroradrift 38s ease-in-out infinite; }
  @keyframes auroradrift{ 0%,100%{ transform:translateX(0) scaleY(1);} 50%{ transform:translateX(6%) scaleY(1.15);} }
  .scene-aurora .scene-mtn.m1{ height:20%; opacity:.7;
    clip-path:polygon(0% 100%,0% 72%,16% 58%,32% 68%,48% 54%,64% 66%,80% 56%,92% 64%,100% 58%,100% 100%);
    background:linear-gradient(180deg, #0a0e1c, #05070f); }
  .scene-aurora .scene-mtn.m2{ height:27%;
    clip-path:polygon(0% 100%,0% 62%,9% 42%,19% 56%,29% 30%,40% 50%,50% 24%,61% 46%,71% 28%,82% 48%,92% 34%,100% 52%,100% 100%);
    background:
      linear-gradient(180deg, rgba(140,230,190,0.22) 0%, transparent 16%),
      repeating-linear-gradient(120deg, rgba(255,255,255,0.025) 0 2px, transparent 2px 8px),
      linear-gradient(180deg, #0d1224 0%, #070a16 60%, #04050c 100%); }

  /* Rainy night */
  .scene-rain .scene-sky{ background:linear-gradient(180deg,#0c1016 0%,#151b24 30%,#1f2833 55%,#283440 75%,#33414f 100%); }
  .scene-rain .scene-glow{ width:50vw; height:22vw; left:50%; top:10%; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse, rgba(160,190,210,0.16), transparent 72%); }
  .scene-rain .scene-cloud{ background:linear-gradient(180deg, rgba(60,72,84,0.65), rgba(30,38,48,0.35)); }
  .scene-rain .cl1{ width:260px; height:60px; left:2%; top:10%; opacity:.9; }
  .scene-rain .cl2{ width:220px; height:50px; left:46%; top:6%; opacity:.85; }
  .scene-rain .cl3{ width:200px; height:46px; left:70%; top:16%; opacity:.75; }
  .scene-rain .scene-mtn.m1{ height:22%; opacity:.6; filter:blur(1.5px);
    clip-path:polygon(0% 100%,0% 72%,16% 58%,32% 68%,48% 54%,64% 66%,80% 56%,92% 64%,100% 58%,100% 100%);
    background:linear-gradient(180deg, rgba(90,105,120,0.6), rgba(60,72,84,0.45)); }
  .scene-rain .scene-mtn.m2{ height:17%;
    clip-path:polygon(0% 100%,0% 62%,9% 42%,19% 56%,29% 30%,40% 50%,50% 24%,61% 46%,71% 28%,82% 48%,92% 34%,100% 52%,100% 100%);
    background:
      linear-gradient(180deg, rgba(150,175,195,0.18) 0%, transparent 18%),
      repeating-linear-gradient(100deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 5px),
      linear-gradient(180deg, #1c2731 0%, #10171e 60%, #0a0f14 100%); }
  .scene-rain .scene-lightning{ position:absolute; inset:0; background:rgba(210,225,240,0.85); opacity:0; mix-blend-mode:screen; animation:lightning-flash 9s linear infinite; }
  .scene-rain .scene-lightning.l2{ animation-delay:4.2s; animation-duration:13s; }
  @keyframes lightning-flash{
    0%, 96.5%, 100%{ opacity:0; }
    97%{ opacity:.55; } 97.4%{ opacity:0.05; } 97.7%{ opacity:.4; } 98%{ opacity:0; }
  }
  .scene-rain .scene-raindrops{ position:absolute; inset:0; overflow:hidden; }
  .scene-rain .scene-raindrops span{
    position:absolute; top:-10%; width:2px; border-radius:2px;
    background:linear-gradient(180deg, transparent, rgba(200,220,240,0.55) 45%, rgba(225,238,250,0.95));
    animation:raindrop linear infinite;
  }
  @keyframes raindrop{
    from{ transform:translateX(0) translateY(-10vh) rotate(20deg); }
    to{ transform:translateX(20vw) translateY(115vh) rotate(20deg); }
  }
  .scene-rain .scene-mist{ height:16%; background:linear-gradient(180deg, rgba(150,170,185,0.3), rgba(150,170,185,0)); }
  .scene-rain .wet-ground{ position:absolute; left:0; right:0; bottom:0; height:6%; background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent); }


  /* ---------- Header / Back button ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:22px 20px 8px; gap:12px; }
  .back-home-btn{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--border);
    padding:10px 16px 10px 12px; border-radius:999px;
    color:var(--text); font-size:14px; font-weight:600;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    transition:background .15s ease, transform .1s ease;
  }
  .back-home-btn:active{ transform:scale(0.96); background:var(--panel-strong); }
  .back-home-btn svg{ width:18px; height:18px; flex-shrink:0; }
  .icon-btn{
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--border); color:var(--text);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  .icon-btn:active{ transform:scale(0.94); background:var(--panel-strong); }
  .icon-btn svg{ width:19px; height:19px; }
  .icon-btn.on{ color:var(--brass); border-color:var(--brass-soft); background:rgba(201,164,92,0.12); }

  /* ---------- Home ---------- */
  .home-hero{ padding:6px 22px 4px; }
  .home-hero .eyebrow{ color:var(--brass); font-size:13px; font-weight:600; margin:0 0 6px; }
  .home-hero h1{ font-size:30px; font-weight:560; margin:0 0 4px; line-height:1.15; }
  .home-hero p{ color:var(--text-dim); font-size:14.5px; margin:0; line-height:1.5; max-width:38ch; }

  .action-row{ display:flex; gap:10px; padding:20px 20px 6px; }
  .pill-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    padding:14px 12px; border-radius:16px; border:1px solid var(--border);
    background:var(--panel); color:var(--text); font-weight:600; font-size:14px;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    transition:transform .1s ease, background .15s ease;
  }
  .pill-btn:active{ transform:scale(0.97); }
  .pill-btn.primary{ background:linear-gradient(135deg, rgba(201,161,90,0.22), rgba(201,161,90,0.08)); border-color:rgba(201,161,90,0.35); }
  .pill-btn svg{ width:17px; height:17px; }

  .section{ padding:26px 20px 4px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .section-head h2{ font-size:19px; font-weight:560; margin:0; }
  .section-head .count{ color:var(--text-faint); font-size:13px; }

  .all-songs-card{
    color:var(--text); text-align:left;
    display:flex; align-items:center; gap:14px; padding:16px; border-radius:var(--r-md);
    background:var(--panel); border:1px solid var(--border);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }

<script>
(function(){
  "use strict";
  var bgRoot = document.getElementById('bg-scene-root');
  var customBg = document.getElementById('bg-custom');
  var scenes = document.querySelectorAll('#bg-scene-root .bg-scene');
  var idx = 0, timer = null;
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var intervalMs = reduceMotion ? 45000 : 22000;

  function startCycle(){
    if(timer || scenes.length < 2) return;
    timer = setInterval(function(){
      var next = (idx + 1) % scenes.length;
      scenes[idx].classList.remove('active');
      scenes[next].classList.add('active');
      idx = next;
    }, intervalMs);
  }
  function stopCycle(){
    if(timer){ clearInterval(timer); timer = null; }
  }
  /* ---------- Stocked Backgrounds (bundled in the app, always available offline) ---------- */
  var STOCK = [
    { id:'nature',  type:'video', label:'Forest Light', src:'./media/bg-nature.mp4',  thumb:'./media/thumb-nature.jpg' },
    { id:'edit',    type:'video', label:'Edit',         src:'./media/bg-edit.mp4',    thumb:'./media/thumb-edit.jpg' },
    { id:'yotei',   type:'video', label:'Yotei Sunset', src:'./media/bg-yotei.mp4',   thumb:'./media/thumb-yotei.jpg' },
    { id:'loop-a',  type:'video', label:'Stairs',       src:'./media/bg-loop-a.mp4',  thumb:'./media/thumb-loop-a.jpg' },
    { id:'loop-b',  type:'video', label:'Rainy City',   src:'./media/bg-loop-b.mp4',  thumb:'./media/thumb-loop-b.jpg' },
    { id:'art',     type:'image', label:'Hands',        src:'./media/bg-art.jpg',     thumb:'./media/thumb-art.jpg' }
  ];
  var stockEl = document.getElementById('bg-stock');
  var stockVideo = document.getElementById('bg-stock-video');
  var stockId = 'nature', stockActive = false;
  try{ stockId = localStorage.getItem('spindle-bg-stock') || 'nature'; }catch(e){}
  function stockItem(id){ return STOCK.filter(function(x){ return x.id === id; })[0] || STOCK[0]; }
  function playStock(){
    if(!stockActive || stockVideo.style.display === 'none' || document.hidden) return;
    var p = stockVideo.play(); if(p && p.catch) p.catch(function(){});
  }
  function setStock(id){
    var item = stockItem(id);
    stockId = item.id;
    try{ localStorage.setItem('spindle-bg-stock', stockId); }catch(e){}
    if(!stockActive) return;
    if(item.type === 'video'){
      stockEl.style.backgroundImage = 'none';
      if(stockVideo.getAttribute('data-src') !== item.src){
        stockVideo.setAttribute('data-src', item.src);
        stockVideo.src = item.src;
        stockVideo.load();
      }
      stockVideo.muted = true;
      stockVideo.style.display = 'block';
      playStock();
    } else {
      stockVideo.pause();
      stockVideo.removeAttribute('src'); stockVideo.removeAttribute('data-src'); stockVideo.load();
      stockVideo.style.display = 'none';
      stockEl.style.backgroundImage = 'url("' + item.src + '")';
    }
  }
  function leaveStock(){
    if(!stockActive) return;
    stockActive = false;
    stockVideo.pause();
    stockVideo.removeAttribute('src'); stockVideo.removeAttribute('data-src'); stockVideo.load();
    stockVideo.style.display = 'none';
    stockEl.style.display = 'none';
    stockEl.style.backgroundImage = 'none';
    document.documentElement.removeAttribute('data-bg');
  }
  // save battery: pause the video whenever the app is hidden / screen is off
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) stockVideo.pause(); else playStock();
  });

  function setMode(mode, color){
    if(mode !== 'stock') leaveStock();
    if(mode !== 'photo') stopCustomVideo();
    if(mode === 'stock'){
      stopCycle();
      bgRoot.style.display = 'none';
      customBg.style.display = 'none';
      stockEl.style.display = 'block';
      document.documentElement.setAttribute('data-bg', 'stock');
      stockActive = true;
      setStock(stockId);
    } else if(mode === 'scenery'){
      customBg.style.display = 'none';
      bgRoot.style.display = '';
      startCycle();
    } else {
      stopCycle();
      bgRoot.style.display = 'none';
      customBg.style.display = 'block';
      if(mode === 'solid'){
        customBg.style.backgroundImage = 'none';
        customBg.style.backgroundColor = color || '#1a1025';
      }
      // 'photo' mode: backgroundImage is set separately via setPhotoUrl once the stored blob loads
    }
  }
  var customVideo = document.getElementById('bg-custom-video');
  var customVideoOn = false;
  function stopCustomVideo(){
    customVideoOn = false;
    customVideo.pause();
    customVideo.removeAttribute('src'); customVideo.load();
    customVideo.style.display = 'none';
  }
  function setPhotoUrl(url, isVideo){
    if(isVideo && url){
      customBg.style.backgroundImage = 'none';
      customVideoOn = true;
      customVideo.src = url; customVideo.muted = true;
      customVideo.style.display = 'block';
      if(!document.hidden){ var p = customVideo.play(); if(p && p.catch) p.catch(function(){}); }
    } else {
      stopCustomVideo();
      customBg.style.backgroundImage = url ? 'url("' + url + '")' : 'none';
    }
  }
  document.addEventListener('visibilitychange', function(){
    if(!customVideoOn) return;
    if(document.hidden) customVideo.pause();
    else { var p = customVideo.play(); if(p && p.catch) p.catch(function(){}); }
  });

  var initialMode = 'scenery', initialColor = '#1a1025';
  try{
    initialMode = localStorage.getItem('spindle-bg-mode') || 'scenery';
    initialColor = localStorage.getItem('spindle-bg-color') || '#1a1025';
  }catch(e){}
  setMode(initialMode, initialColor);

  window.__spindleBg = { setMode: setMode, setPhotoUrl: setPhotoUrl, setStock: setStock, stock: STOCK, getStockId: function(){ return stockId; } };
})();
</script>

/* ============================================================
   INDEXEDDB LAYER
============================================================ */
const DB_NAME = 'spindle-db-v1';
const DB_VERSION = 3;
let dbPromise = null;
function openDB(){
  if(dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('tracks')) db.createObjectStore('tracks', { keyPath:'id' });
      if(!db.objectStoreNames.contains('playlists')) db.createObjectStore('playlists', { keyPath:'id' });
      if(!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath:'id' });
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath:'id' });
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return dbPromise;
}
async function idbPut(store, value){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = ()=> resolve(value);
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbGetAll(store){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbGet(store, id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = ()=> resolve(req.result || null);
    req.onerror = ()=> reject(req.error);
  });
}
async function idbDelete(store, id){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}
async function idbClearAll(){
  const db = await openDB();
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(['tracks','playlists','history'], 'readwrite');
    tx.objectStore('tracks').clear();
    tx.objectStore('playlists').clear();
    tx.objectStore('history').clear();
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

let editingPlaylistDraftCover = null; // used while modal open

/* ============================================================
   AUDIO ELEMENT + MEDIA SESSION
============================================================ */
const audio = new Audio();
audio.preload = 'metadata';

audio.addEventListener('play', ()=>{ state.isPlaying = true; syncPlayPauseUI(); ensureAudioGraph(); startVisualizerLoop(); if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing'; });
audio.addEventListener('pause', ()=>{ state.isPlaying = false; syncPlayPauseUI(); if('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused'; });

/* ---- Live frequency visualizer (Web Audio API) ---- */
let audioCtx = null, analyserNode = null, visualizerData = null, vizRAF = null;
let eqFilters = []; // 5 BiquadFilterNode instances, wired in series between the source and the analyser
let mainGain = null; // gain node for the primary <audio> element, used by the crossfade engine
const EQ_FREQS = [60, 230, 910, 3600, 14000];
const EQ_PRESETS = {
  flat:  { label:'Flat',       bands:[0, 0, 0, 0, 0] },
  bass:  { label:'Bass Boost', bands:[7, 5, 0, -1, -1] },
  vocal: { label:'Vocal',      bands:[-3, -1, 4, 4, 1] },
};
function ensureAudioGraph(){
  if(audioCtx) { if(audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{}); return; }
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    audioCtx = new Ctx();
    // createMediaElementSource can only ever be called once for this <audio> element,
    // so every downstream feature (EQ, analyser, crossfade gain) has to be built on this single call.
    const source = audioCtx.createMediaElementSource(audio);
    mainGain = audioCtx.createGain();
    mainGain.gain.value = 1;
    eqFilters = EQ_FREQS.map((freq, i) => {
      const f = audioCtx.createBiquadFilter();
      f.type = 'peaking';
      f.frequency.value = freq;
      f.Q.value = 1.0;
      f.gain.value = state.eq.enabled ? (state.eq.bands[i] || 0) : 0;
      return f;
    });
    analyserNode = audioCtx.createAnalyser();
    analyserNode.fftSize = 64;
    analyserNode.smoothingTimeConstant = 0.75;
    source.connect(mainGain);
    let node = mainGain;
    for(const f of eqFilters){ node.connect(f); node = f; }
    node.connect(analyserNode);
    analyserNode.connect(audioCtx.destination); // must reconnect to destination or audio goes silent
    visualizerData = new Uint8Array(analyserNode.frequencyBinCount);
  }catch(e){ console.warn('Audio graph unavailable on this browser', e); analyserNode = null; eqFilters = []; }
}
function applyEqToFilters(){
  eqFilters.forEach((f, i) => { f.gain.value = state.eq.enabled ? (state.eq.bands[i] || 0) : 0; });
}
function persistEqSettings(){
  try{ localStorage.setItem('spindle-eq', JSON.stringify(state.eq)); }catch(e){}
}
function loadEqSettings(){
  try{
    const raw = localStorage.getItem('spindle-eq');
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && Array.isArray(parsed.bands) && parsed.bands.length === 5){
      state.eq.enabled = !!parsed.enabled;
      state.eq.preset = typeof parsed.preset === 'string' ? parsed.preset : 'custom';
      state.eq.bands = parsed.bands.map(v => typeof v === 'number' && !isNaN(v) ? v : 0);
    }
  }catch(e){ console.warn('Failed to load EQ settings', e); }
}

/* ---------- Speed & pitch ---------- */
function applyPreservesPitch(el, on){
  // Different browsers still expose this under different names; setting all of them is harmless.
  try{ el.preservesPitch = on; }catch(e){}
  try{ el.mozPreservesPitch = on; }catch(e){}
  try{ el.webkitPreservesPitch = on; }catch(e){}
}
function setPlaybackRate(rate){
  state.playbackRate = rate;
  audio.playbackRate = rate;
  persistPlaybackSettings();
}
function setPreservesPitch(on){
  state.preservesPitch = on;
  applyPreservesPitch(audio, on);
  persistPlaybackSettings();
}
function persistPlaybackSettings(){
  try{
    localStorage.setItem('spindle-playback', JSON.stringify({
      playbackRate: state.playbackRate,
      preservesPitch: state.preservesPitch,
      crossfadeSeconds: state.crossfadeSeconds,
    }));
  }catch(e){}
}
function loadPlaybackSettings(){
  try{
    const raw = localStorage.getItem('spindle-playback');
    if(!raw) return;
    const parsed = JSON.parse(raw);
    if(parsed && typeof parsed === 'object'){
      if(typeof parsed.playbackRate === 'number' && parsed.playbackRate >= 0.5 && parsed.playbackRate <= 2) state.playbackRate = parsed.playbackRate;
      if(typeof parsed.preservesPitch === 'boolean') state.preservesPitch = parsed.preservesPitch;
      if(typeof parsed.crossfadeSeconds === 'number' && parsed.crossfadeSeconds >= 0 && parsed.crossfadeSeconds <= 10) state.crossfadeSeconds = parsed.crossfadeSeconds;
    }
  }catch(e){ console.warn('Failed to load playback settings', e); }
  audio.playbackRate = state.playbackRate;
  applyPreservesPitch(audio, state.preservesPitch);
}
function startVisualizerLoop(){
  if(vizRAF) return;
  function tick(){
    if(!analyserNode || state.view !== 'now-playing' || !state.isPlaying){ vizRAF = null; return; }
    analyserNode.getByteFrequencyData(visualizerData);
    const bars = document.querySelectorAll('#visualizer-bars span');
    if(bars.length){
      const bucket = Math.max(1, Math.floor(visualizerData.length / bars.length));
      bars.forEach((bar, i)=>{
        let sum = 0, count = 0;
        for(let j = i*bucket; j < (i+1)*bucket && j < visualizerData.length; j++){ sum += visualizerData[j]; count++; }
        const avg = count ? sum / count : 0;
        bar.style.height = Math.max(4, Math.min(34, (avg/255)*34)) + 'px';
      });
    }
    vizRAF = requestAnimationFrame(tick);
  }
  vizRAF = requestAnimationFrame(tick);
}

function setupMediaSession(){
  if(!('mediaSession' in navigator)) return;
  try{
    navigator.mediaSession.setActionHandler('play', ()=> audio.play().catch(()=>{}));
    navigator.mediaSession.setActionHandler('pause', ()=> audio.pause());
    navigator.mediaSession.setActionHandler('previoustrack', ()=> prevTrack());
    navigator.mediaSession.setActionHandler('nexttrack', ()=> advanceTrack(false));
    navigator.mediaSession.setActionHandler('seekto', (details)=>{
      if(details.fastSeek && 'fastSeek' in audio){ audio.fastSeek(details.seekTime); return; }
      if(details.seekTime != null) audio.currentTime = details.seekTime;
    });
    navigator.mediaSession.setActionHandler('seekbackward', (d)=>{ audio.currentTime = Math.max(0, audio.currentTime - (d.seekOffset||10)); });
    navigator.mediaSession.setActionHandler('seekforward', (d)=>{ audio.currentTime = Math.min(audio.duration||0, audio.currentTime + (d.seekOffset||10)); });
  }catch(e){ /* some handlers unsupported on some browsers */ }
}
function updateMediaSessionMetadata(track){
  if(!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: track.title || 'Unknown Title',
    artist: track.artist || 'Unknown Artist',
    album: track.album || 'Spindle',
    artwork: track.coverArt ? [
      { src: track.coverArt, sizes: '256x256', type: 'image/png' },
      { src: track.coverArt, sizes: '512x512', type: 'image/png' },
    ] : [],
  });
}

/* ============================================================
   HELPERS
============================================================ */
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8); }
function formatTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60);
  return m + ':' + String(s).padStart(2,'0');
}
function stripExt(name){ return name.replace(/\.[^/.]+$/, ''); }
function escapeHtml(str){
  return String(str==null?'':str).replace(/[&<>"']/g, (c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function getTrackById(id){ return state.tracks.find(t => t.id === id) || null; }
function getPlaylistById(id){ return state.playlists.find(p => p.id === id) || null; }
function coverArtOrNull(t){ return t && t.coverArt ? t.coverArt : null; }

/* Recently Played: dedupe the history log to one entry per track, newest first,
   skipping any track that no longer exists in the library. */
function getRecentPlayEntries(){
  const seen = new Set();
  const out = [];
  for(const h of state.history){
    if(seen.has(h.trackId)) continue;
    if(!getTrackById(h.trackId)) continue;
    seen.add(h.trackId);
    out.push({ trackId: h.trackId, playedAt: h.playedAt });
  }
  return out;
}
function getRecentTrackIds(){ return getRecentPlayEntries().map(e => e.trackId); }

function formatRelativeTime(ts){
  if(!ts) return '';
  const diff = Math.max(0, Date.now() - ts);
  const min = Math.floor(diff / 60000);
  if(min < 1) return 'Just now';
  if(min < 60) return min + 'm ago';
  const hr = Math.floor(min / 60);
  if(hr < 24) return hr + 'h ago';
  const day = Math.floor(hr / 24);
  if(day < 7) return day + 'd ago';
  return new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric' });
}

function showToast(msg){
  const root = document.getElementById('toast-root');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition = 'opacity .3s ease'; el.style.opacity = '0'; setTimeout(()=> el.remove(), 300); }, 2600);
}

/* ============================================================
   PLAYBACK ENGINE
============================================================ */
function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function buildPlayOrder(){
  const idxs = state.baseQueue.map((_, i) => i);
  return state.shuffle ? shuffleArray(idxs) : idxs;
}

function startQueue(trackIds, startTrackId, contextId){
  if(!trackIds.length) return;
  state.baseQueue = trackIds.slice();
  state.queueContextId = contextId;
  state.playOrder = buildPlayOrder();
  const startBaseIndex = Math.max(0, state.baseQueue.indexOf(startTrackId));
  if(state.shuffle){
    const pos = state.playOrder.indexOf(startBaseIndex);
    if(pos > -1){ state.playOrder.splice(pos,1); state.playOrder.unshift(startBaseIndex); }
  }
  state.currentIndex = state.playOrder.indexOf(startBaseIndex);
  loadAndPlayCurrent();
}

async function loadAndPlayCurrent(){
  if(crossfadeInProgress) cancelCrossfade();
  if(state.currentIndex < 0 || state.currentIndex >= state.playOrder.length) return;
  const baseIndex = state.playOrder[state.currentIndex];
  const trackId = state.baseQueue[baseIndex];
  const track = getTrackById(trackId);
  if(!track){ advanceTrack(true); return; }
  try{
    await loadTrackIntoAudio(track);
    await audio.play();
    updateMediaSessionMetadata(track);
    if('mediaSession' in navigator){
      try{ navigator.mediaSession.setPositionState({ duration: audio.duration||0, playbackRate:1, position:0 }); }catch(e){}
    }
    logPlay(track); // fire-and-forget: records history + increments play count
    render();
  }catch(err){
    console.error(err);
    showToast('That track is missing or unsupported \u2014 skipping.');
    advanceTrack(true);
  }
}

const HISTORY_CAP = 300;
async function logPlay(track){
  try{
    const entry = { id: uid('hist'), trackId: track.id, playedAt: Date.now() };
    await idbPut('history', entry);
    state.history.unshift(entry);
    if(state.history.length > HISTORY_CAP){
      const overflow = state.history.slice(HISTORY_CAP);
      state.history = state.history.slice(0, HISTORY_CAP);
      for(const old of overflow){ await idbDelete('history', old.id); }
    }
    const full = await idbGet('tracks', track.id);
    if(full){
      full.playCount = (full.playCount || 0) + 1;
      await idbPut('tracks', full);
      const lightRef = getTrackById(track.id);
      if(lightRef) lightRef.playCount = full.playCount;
    }
  }catch(e){ console.warn('Failed to log play', e); }
}

async function loadTrackIntoAudio(track){
  if(state.currentObjectURL){ URL.revokeObjectURL(state.currentObjectURL); state.currentObjectURL = null; }
  const full = await idbGet('tracks', track.id);
  const blob = full && full.fileBlob;
  if(!blob) throw new Error('Missing audio blob for ' + track.id);
  const url = URL.createObjectURL(blob);
  state.currentObjectURL = url;
  audio.src = url;
  audio.currentTime = 0;
  audio.playbackRate = state.playbackRate;
  applyPreservesPitch(audio, state.preservesPitch);
  await new Promise((resolve, reject)=>{
    function onLoaded(){ cleanup(); resolve(); }
    function onErr(){ cleanup(); reject(new Error('Audio failed to load')); }
    function cleanup(){ audio.removeEventListener('loadedmetadata', onLoaded); audio.removeEventListener('error', onErr); }
    audio.addEventListener('loadedmetadata', onLoaded, { once:true });
    audio.addEventListener('error', onErr, { once:true });
  });
}

function advanceTrack(auto){
  if(!state.baseQueue.length) return;
  if(crossfadeInProgress) cancelCrossfade();
  if(auto && state.repeat === 'one'){ audio.currentTime = 0; audio.play().catch(()=>{}); return; }
  let ni = state.currentIndex + 1;
  if(ni >= state.playOrder.length){
    if(state.repeat === 'all'){ ni = 0; }
    else{
      audio.pause();
      audio.currentTime = 0;
      state.isPlaying = false;
      render();
      return;
    }
  }
  state.currentIndex = ni;
  loadAndPlayCurrent();
}

function prevTrack(){
  if(!state.baseQueue.length) return;
  if(crossfadeInProgress) cancelCrossfade();
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  let pi = state.currentIndex - 1;
  if(pi < 0){ pi = state.repeat === 'all' ? state.playOrder.length - 1 : 0; }
  state.currentIndex = pi;
  loadAndPlayCurrent();
}

function togglePlayPause(){
  if(!state.baseQueue.length) return;
  if(state.isPlaying){
    audio.pause();
    if(crossfadeInProgress && crossfadeAudio) crossfadeAudio.pause();
  }else{
    audio.play().catch(()=>{});
    if(crossfadeInProgress && crossfadeAudio) crossfadeAudio.play().catch(()=>{});
  }
}

/* ---------- Crossfade engine ---------- */
// A second, DOM-detached <audio> element that pre-plays the upcoming track while the
// main element fades out, both routed through the same Web Audio gain/EQ graph. Every
// other feature (seek, media session, progress, EQ) still only ever touches the main
// `audio` element \u2014 the crossfade element is a temporary bridge that hands off and
// disappears once the transition finishes, so it can't leave stray state behind.
let crossfadeAudio = null, crossfadeGainNode = null, crossfadeObjectURL = null;
let crossfadeInProgress = false, crossfadeTimer = null;

function peekNextTrack(){
  if(!state.baseQueue.length || state.repeat === 'one') return null;
  let ni = state.currentIndex + 1;
  if(ni >= state.playOrder.length){
    if(state.repeat === 'all') ni = 0;
    else return null;
  }
  const baseIndex = state.playOrder[ni];
  const trackId = state.baseQueue[baseIndex];
  const track = getTrackById(trackId);
  if(!track) return null;
  return { nextIndex: ni, track };
}

function ensureCrossfadeGraph(){
  if(crossfadeAudio || !audioCtx || !eqFilters.length) return;
  try{
    crossfadeAudio = new Audio();
    crossfadeAudio.preload = 'auto';
    crossfadeAudio.volume = 1;
    const src = audioCtx.createMediaElementSource(crossfadeAudio);
    crossfadeGainNode = audioCtx.createGain();
    crossfadeGainNode.gain.value = 0;
    src.connect(crossfadeGainNode);
    crossfadeGainNode.connect(eqFilters[0]); // fans into the same EQ chain the main path uses
  }catch(e){ console.warn('Crossfade graph unavailable on this browser', e); crossfadeAudio = null; }
}

async function loadTrackIntoCrossfadeElement(track){
  const full = await idbGet('tracks', track.id);
  const blob = full && full.fileBlob;
  if(!blob) throw new Error('Missing audio blob for ' + track.id);
  if(crossfadeObjectURL){ URL.revokeObjectURL(crossfadeObjectURL); crossfadeObjectURL = null; }
  const url = URL.createObjectURL(blob);
  crossfadeObjectURL = url;
  crossfadeAudio.src = url;
  crossfadeAudio.currentTime = 0;
  crossfadeAudio.playbackRate = state.playbackRate;
  applyPreservesPitch(crossfadeAudio, state.preservesPitch);
  await new Promise((resolve, reject)=>{
    function onLoaded(){ cleanup(); resolve(); }
    function onErr(){ cleanup(); reject(new Error('Crossfade audio failed to load')); }
    function cleanup(){ crossfadeAudio.removeEventListener('loadedmetadata', onLoaded); crossfadeAudio.removeEventListener('error', onErr); }
    crossfadeAudio.addEventListener('loadedmetadata', onLoaded, { once:true });
    crossfadeAudio.addEventListener('error', onErr, { once:true });
  });
}

function maybeStartCrossfade(){
  if(crossfadeInProgress) return;
  if(!state.crossfadeSeconds || state.crossfadeSeconds <= 0) return;
  if(!audio.duration || !isFinite(audio.duration)) return;
  if((audio.duration - audio.currentTime) <= state.crossfadeSeconds){
    startCrossfade();
  }
}

async function startCrossfade(){
  if(crossfadeInProgress) return;
  const nextInfo = peekNextTrack();
  if(!nextInfo) return; // end of queue with no repeat \u2014 let it end normally
  crossfadeInProgress = true;
  try{
    ensureAudioGraph();
    ensureCrossfadeGraph();
    if(!crossfadeAudio || !audioCtx || !mainGain){ crossfadeInProgress = false; return; } // Web Audio unavailable \u2014 falls back to a normal gap-transition via 'ended'

    await loadTrackIntoCrossfadeElement(nextInfo.track);
    crossfadeGainNode.gain.value = 0;
    await crossfadeAudio.play();

    const now = audioCtx.currentTime;
    const dur = Math.max(0.5, state.crossfadeSeconds);
    mainGain.gain.cancelScheduledValues(now);
    mainGain.gain.setValueAtTime(mainGain.gain.value, now);
    mainGain.gain.linearRampToValueAtTime(0, now + dur);
    crossfadeGainNode.gain.cancelScheduledValues(now);
    crossfadeGainNode.gain.setValueAtTime(0, now);
    crossfadeGainNode.gain.linearRampToValueAtTime(1, now + dur);

    crossfadeTimer = setTimeout(()=> finishCrossfade(nextInfo), dur * 1000);
  }catch(err){
    console.warn('Crossfade failed, falling back to a normal transition', err);
    crossfadeInProgress = false;
  }
}

async function finishCrossfade(nextInfo){
  // The crossfade element is already playing the next track at full volume \u2014 hand its
  // exact position to the main element so every other feature keeps working exactly as
  // it does for a normal track change.
  const handoffTime = crossfadeAudio.currentTime;
  const track = nextInfo.track;
  try{
    audio.pause();
    state.currentIndex = nextInfo.nextIndex;
    await loadTrackIntoAudio(track);
    audio.currentTime = handoffTime;
    if(audioCtx && mainGain){ mainGain.gain.cancelScheduledValues(audioCtx.currentTime); mainGain.gain.setValueAtTime(1, audioCtx.currentTime); }
    await audio.play();
    crossfadeAudio.pause();
    if(crossfadeGainNode) crossfadeGainNode.gain.value = 0;
    updateMediaSessionMetadata(track);
    if('mediaSession' in navigator){
      try{ navigator.mediaSession.setPositionState({ duration: audio.duration||0, playbackRate: state.playbackRate, position: handoffTime }); }catch(e){}
    }
    logPlay(track);
    render();
  }catch(err){
    console.error('Crossfade handoff failed, skipping ahead normally', err);
    advanceTrack(true);
  }finally{
    crossfadeInProgress = false;
  }
}

function cancelCrossfade(){
  if(crossfadeTimer){ clearTimeout(crossfadeTimer); crossfadeTimer = null; }
  if(crossfadeAudio){ try{ crossfadeAudio.pause(); }catch(e){} }
  if(crossfadeGainNode) crossfadeGainNode.gain.value = 0;
  if(audioCtx && mainGain){ try{ mainGain.gain.cancelScheduledValues(audioCtx.currentTime); mainGain.gain.setValueAtTime(1, audioCtx.currentTime); }catch(e){} }
  crossfadeInProgress = false;
}

function matchesSearch(t, query){
  if(!query) return true;
  const q = query.toLowerCase();
  return (t.title && t.title.toLowerCase().includes(q))
      || (t.artist && t.artist.toLowerCase().includes(q))
      || (t.album && t.album.toLowerCase().includes(q));
}
function sortTracks(tracks, sortBy){
  const arr = tracks.slice();
  switch(sortBy){
    case 'recent': return arr.sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
    case 'plays': return arr.sort((a,b)=> (b.playCount||0) - (a.playCount||0));
    case 'alpha': return arr.sort((a,b)=> (a.title||'').localeCompare(b.title||''));
    case 'duration': return arr.sort((a,b)=> (b.duration||0) - (a.duration||0));
    default: return arr;
  }
}
const SORT_LABELS = { default:'Default', recent:'Recently Added', plays:'Most Played', alpha:'A\u2013Z', duration:'Duration' };

   TAG / FILE HANDLING
============================================================ */
function extractTags(file){
  return new Promise((resolve)=>{
    if(typeof jsmediatags === 'undefined'){ resolve({}); return; }
    try{
      jsmediatags.read(file, {
        onSuccess: (tag)=>{
          const tags = (tag && tag.tags) || {};
          let coverArt = null;
          if(tags.picture && tags.picture.data && tags.picture.format){
            try{
              const data = tags.picture.data;
              let binary = '';
              const chunk = 0x8000;
              for(let i=0;i<data.length;i+=chunk){
                binary += String.fromCharCode.apply(null, data.slice(i, i+chunk));
              }
              coverArt = 'data:' + tags.picture.format + ';base64,' + btoa(binary);
            }catch(e){ coverArt = null; }
          }
          resolve({ title: tags.title, artist: tags.artist, album: tags.album, coverArt, embeddedLyrics: (tags.lyrics && tags.lyrics.lyrics) ? tags.lyrics.lyrics : null });
        },
        onError: ()=> resolve({}),
      });
    }catch(e){ resolve({}); }
  });
}
/* ---------- LRC lyrics parsing ---------- */
function parseLRC(text){
  if(!text) return [];
  const lines = text.split(/\r?\n/);
  const timeTagRe = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
  const result = [];
  for(const line of lines){
    const times = [];
    let m;
    timeTagRe.lastIndex = 0;
    while((m = timeTagRe.exec(line)) !== null){
      const min = parseInt(m[1], 10);
      const sec = parseInt(m[2], 10);
      let frac = m[3] || '0';
      if(frac.length === 1) frac += '00'; else if(frac.length === 2) frac += '0';
      const ms = parseInt(frac, 10);
      times.push(min*60 + sec + ms/1000);
    }
    if(!times.length) continue; // skips metadata tags like [ar:...]/[ti:...] and any blank/plain lines
    const cleaned = line.replace(timeTagRe, '').trim();
    for(const t of times) result.push({ time:t, text:cleaned });
  }
  result.sort((a,b)=> a.time - b.time);
  return result;
}
function updateLyricsUI(){
  if(!state.showLyrics) return;
  const scrollEl = document.getElementById('lyrics-scroll');
  if(!scrollEl) return;
  const lines = scrollEl.querySelectorAll('.lyrics-line[data-time]');
  if(!lines.length) return;
  const cur = audio.currentTime;
  let activeIdx = -1;
  for(let i=0;i<lines.length;i++){
    if(parseFloat(lines[i].dataset.time) <= cur) activeIdx = i;
    else break;
  }
  lines.forEach((el,i)=> el.classList.toggle('active', i===activeIdx));
  if(activeIdx >= 0){
    const activeEl = lines[activeIdx];
    const target = activeEl.offsetTop - scrollEl.clientHeight/2 + activeEl.clientHeight/2;
    scrollEl.scrollTo({ top: Math.max(0, target), behavior:'smooth' });
  }
}


/* ---------- File name -> artist / title (for MP3s with no tags) ---------- */
const JUNK_WORDS = /\b(official\s*(music\s*)?(video|audio|lyric\s*video|visuali[sz]er)|music\s*video|lyric\s*video|lyrics?|with\s*lyrics|paroles|letra|testo|napisy(\s*pl)?|sub(titulos|s)?(\s*espa[nñ]ol)?|audio|visuali[sz]er|hd|hq|4k|1080p|720p|320\s*kbps|128\s*kbps|remaster(ed)?(\s*\d{4})?)\b/gi;
function parseFileName(fileName){
  let n = stripExt(fileName || '');
  // a double underscore usually marks where ( ) or [ ] used to be -> drop what's inside
  n = n.replace(/_{2,}[^_]*?_{2,}/g, ' ').replace(/_{2,}.*$/, ' ');
  n = n.replace(/\([^)]*\)|\[[^\]]*\]/g, ' ');
  n = n.replace(/_/g, ' ');
  n = n.replace(JUNK_WORDS, ' ').replace(/\s+/g, ' ').replace(/[\s\-–—|]+$/,'').trim();
  let artist = '', title = n;
  const m = n.split(/\s+[-–—]\s+/);
  if(m.length >= 2){ artist = m[0].trim(); title = m.slice(1).join(' - ').trim(); }
  return { artist, title: title || stripExt(fileName || '') };
}
function lookupNames(track){
  const hasRealArtist = track.artist && track.artist !== 'Unknown Artist';
  if(hasRealArtist && track.title && track.title !== stripExt(track.fileName || '')) return { artist: track.artist, title: track.title };
  const p = parseFileName(track.fileName || track.title || '');
  return { artist: p.artist || (hasRealArtist ? track.artist : ''), title: p.title };
}
const lyricsTried = new Set(); // tracks already auto-searched this session
async function autoFetchLyrics(track){
  if(!track || track.lyricsLRC || track.embeddedLyrics || lyricsTried.has(track.id)) return;
  if(!navigator.onLine) return;
  lyricsTried.add(track.id);
  await fetchLyricsOnline(track, true);
}

/* ---------- Online lyrics lookup (LRCLIB \u2014 free, open, no key required) ---------- */
let lyricsLookupInProgress = false;
async function saveLyricsForTrack(track, syncedLyrics, plainLyrics){
  const full = await idbGet('tracks', track.id);
  if(full){
    if(syncedLyrics) full.lyricsLRC = syncedLyrics;
    else if(plainLyrics) full.embeddedLyrics = plainLyrics;
    await idbPut('tracks', full);
  }
  if(syncedLyrics) track.lyricsLRC = syncedLyrics;
  else if(plainLyrics) track.embeddedLyrics = plainLyrics;
}
async function fetchLyricsOnline(track, silent){
  if(lyricsLookupInProgress) return;
  if(!navigator.onLine){
    if(!silent) showToast('You\u2019re offline \u2014 can\u2019t search for lyrics online right now.');
    return;
  }
  lyricsLookupInProgress = true;
  if(!silent) showToast('Searching for lyrics\u2026');
  const names = lookupNames(track);
  try{
    // Exact lookup first (title + artist + duration gives the most reliable match).
    const exactParams = new URLSearchParams({ track_name: names.title || '', artist_name: names.artist || '' });
    if(track.duration) exactParams.set('duration', String(Math.round(track.duration)));
    let found = null;
    try{
      const res = await fetch('https://lrclib.net/api/get?' + exactParams.toString());
      if(res.ok){
        const data = await res.json();
        if(data && (data.syncedLyrics || data.plainLyrics)) found = data;
      }
    }catch(e){ /* fall through to fuzzy search below */ }

    if(!found){
      const q = [names.artist, names.title].filter(Boolean).join(' ').trim() || names.title || '';
      const res2 = await fetch('https://lrclib.net/api/search?' + new URLSearchParams({ q }).toString());
      if(res2.ok){
        const results = await res2.json();
        if(Array.isArray(results) && results.length){
          found = results.find(r => r.syncedLyrics) || results.find(r => r.plainLyrics) || null;
        }
      }
    }

    if(!found || (!found.syncedLyrics && !found.plainLyrics)){
      if(!silent) showToast('No lyrics found online for this song.');
      return;
    }
    await saveLyricsForTrack(track, found.syncedLyrics || null, found.plainLyrics || null);
    showToast(found.syncedLyrics ? 'Synced lyrics found!' : 'Lyrics found (not time-synced).');
    if(getCurrentPlayingTrack() && getCurrentPlayingTrack().id === track.id){ render(); updateLyricsUI(); }
  }catch(err){
    console.error('Online lyrics lookup failed', err);
    if(!silent) showToast('Couldn\u2019t reach the lyrics service \u2014 try again later, or upload an .lrc file.');
  }finally{
    lyricsLookupInProgress = false;
  }
}

function extractDuration(file){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const temp = new Audio();
    let done = false;
    function finish(val){ if(done) return; done = true; URL.revokeObjectURL(url); resolve(val); }
    temp.addEventListener('loadedmetadata', ()=> finish(isFinite(temp.duration) ? temp.duration : 0), { once:true });
    temp.addEventListener('error', ()=> finish(0), { once:true });
    setTimeout(()=> finish(0), 8000);
    temp.preload = 'metadata';
    temp.src = url;
  });
}

async function handleFilesSelected(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const valid = files.filter(f => f.type === 'audio/mpeg' || /\.mp3$/i.test(f.name));
  const invalidCount = files.length - valid.length;
  if(!valid.length){
    showToast('No valid MP3 files were selected.');
    return;
  }
  showToast('Adding ' + valid.length + ' song' + (valid.length>1?'s':'') + '\u2026');
  const newIds = [];
  for(const file of valid){
    try{
      const [meta, duration] = await Promise.all([extractTags(file), extractDuration(file)]);
      const track = {
        id: uid('trk'),
        title: (meta.title && meta.title.trim()) || parseFileName(file.name).title,
        artist: (meta.artist && meta.artist.trim()) || parseFileName(file.name).artist || 'Unknown Artist',
        album: (meta.album && meta.album.trim()) || '',
        duration: duration || 0,
        coverArt: meta.coverArt || null,
        fileName: file.name,
        addedAt: Date.now(),
        fileBlob: file,
        lyricsLRC: null,               // synced lyrics from an uploaded .lrc file, if any
        embeddedLyrics: meta.embeddedLyrics || null, // unsynced lyrics from the file's own ID3 tag, if present
      };
      await idbPut('tracks', track);
      const light = Object.assign({}, track); delete light.fileBlob;
      state.tracks.unshift(light);
      newIds.push(track.id);
    }catch(err){
      console.error('Failed to import', file.name, err);
      showToast('Couldn\u2019t add "' + file.name + '".');
    }
  }
  if(invalidCount > 0) showToast('Skipped ' + invalidCount + ' unsupported file' + (invalidCount>1?'s':'') + '.');

  if(state.pendingUploadPlaylistId && state.pendingUploadPlaylistId !== 'all' && newIds.length){
    const pl = getPlaylistById(state.pendingUploadPlaylistId);
    if(pl){
      pl.trackIds = pl.trackIds.concat(newIds);
      await idbPut('playlists', pl);
    }
  }
  state.pendingUploadPlaylistId = null;
  render();
  (async()=>{
    for(const id of newIds){
      const t = state.tracks.find(x => x.id === id);
      if(t) await autoFetchLyrics(t);
    }
  })();
}

async function handleZipSelected(file){
  if(!file) return;
  if(typeof JSZip === 'undefined'){
    showToast('ZIP import needs an internet connection the first time it\u2019s used.');
    return;
  }
  showToast('Reading ZIP\u2026');
  let zip;
  try{
    zip = await JSZip.loadAsync(file);
  }catch(err){
    console.error('Invalid ZIP file', err);
    showToast('That doesn\u2019t look like a valid ZIP file.');
    return;
  }
  const entries = Object.values(zip.files).filter(f => !f.dir && /\.mp3$/i.test(f.name));
  if(!entries.length){
    showToast('That ZIP didn\u2019t contain any MP3 files.');
    return;
  }
  const zipFiles = [];
  for(const entry of entries){
    try{
      const blob = await entry.async('blob');
      const name = entry.name.split('/').pop(); // drop any folder path inside the zip
      zipFiles.push(new File([blob], name, { type:'audio/mpeg' }));
    }catch(err){
      console.error('Failed to extract', entry.name, err);
    }
  }
  if(!zipFiles.length){
    showToast('Couldn\u2019t extract any songs from that ZIP.');
    return;
  }
  const playlistName = stripExt(file.name) || 'Imported Playlist';
  const pl = await createPlaylist(playlistName, null);
  state.pendingUploadPlaylistId = pl.id;
  await handleFilesSelected(zipFiles);
  const refreshed = getPlaylistById(pl.id);
  if(!refreshed || refreshed.trackIds.length === 0){
    await deletePlaylist(pl.id);
    showToast('Couldn\u2019t import any songs from that ZIP.');
    render();
    return;
  }
  state.currentPlaylistId = pl.id;
  state.view = 'playlist';
  transitionRender('forward');
  showToast('Imported \u201c' + playlistName + '\u201d \u2014 ' + refreshed.trackIds.length + ' song' + (refreshed.trackIds.length>1?'s':'') + '.');
}

async function handleFolderSelected(fileList){
  const files = Array.from(fileList || []);
  if(!files.length) return;
  const mp3Files = files.filter(f => /\.mp3$/i.test(f.name));
  if(!mp3Files.length){
    showToast('That folder didn\u2019t contain any MP3 files.');
    return;
  }
  // webkitRelativePath looks like "FolderName/sub/song.mp3" \u2014 the first segment is the folder the user picked.
  const firstPath = mp3Files[0].webkitRelativePath || '';
  const folderName = firstPath.includes('/') ? firstPath.split('/')[0] : 'Imported Folder';
  const pl = await createPlaylist(folderName || 'Imported Folder', null);
  state.pendingUploadPlaylistId = pl.id;
  await handleFilesSelected(mp3Files);
  const refreshed = getPlaylistById(pl.id);
  if(!refreshed || refreshed.trackIds.length === 0){
    await deletePlaylist(pl.id);
    showToast('Couldn\u2019t import any songs from that folder.');
    render();
    return;
  }
  state.currentPlaylistId = pl.id;
  state.view = 'playlist';
  transitionRender('forward');
  showToast('Imported \u201c' + folderName + '\u201d \u2014 ' + refreshed.trackIds.length + ' song' + (refreshed.trackIds.length>1?'s':'') + '.');
}

============================================================ */
async function createPlaylist(name, coverUrl){
  const pl = { id: uid('pl'), name: name || 'New Playlist', coverUrl: coverUrl || null, trackIds: [], createdAt: Date.now() };
  await idbPut('playlists', pl);
  state.playlists.unshift(pl);
  return pl;
}
async function updatePlaylist(id, changes){
  const pl = getPlaylistById(id);
  if(!pl) return;
  Object.assign(pl, changes);
  await idbPut('playlists', pl);
}
async function deletePlaylist(id){
  await idbDelete('playlists', id);
  state.playlists = state.playlists.filter(p => p.id !== id);
  if(state.queueContextId === id){ /* keep playing but detach context so it still works via track ids already loaded */ }
}
async function duplicatePlaylist(id){
  const pl = getPlaylistById(id);
  if(!pl) return null;
  const copy = { id: uid('pl'), name: pl.name + ' (Copy)', coverUrl: pl.coverUrl || null, trackIds: pl.trackIds.slice(), createdAt: Date.now() };
  await idbPut('playlists', copy);
  state.playlists.unshift(copy);
  return copy;
}
async function addTracksToPlaylist(playlistId, trackIds){
  const pl = getPlaylistById(playlistId);
  if(!pl) return;
  const set = new Set(pl.trackIds);
  trackIds.forEach(id => set.add(id));
  pl.trackIds = Array.from(set);
  await idbPut('playlists', pl);
}
async function removeTrackFromPlaylist(playlistId, trackId){
  const pl = getPlaylistById(playlistId);
  if(!pl) return;
  pl.trackIds = pl.trackIds.filter(id => id !== trackId);
  await idbPut('playlists', pl);
}
async function deleteTrackPermanently(trackId){
  await idbDelete('tracks', trackId);
  state.tracks = state.tracks.filter(t => t.id !== trackId);
  for(const pl of state.playlists){
    if(pl.trackIds.includes(trackId)){
      pl.trackIds = pl.trackIds.filter(id => id !== trackId);
      await idbPut('playlists', pl);
    }
  }
  const historyToRemove = state.history.filter(h => h.trackId === trackId);
  if(historyToRemove.length){
    state.history = state.history.filter(h => h.trackId !== trackId);
    for(const h of historyToRemove){ await idbDelete('history', h.id); }
  }
  if(state.baseQueue.includes(trackId)){
    const wasCurrent = getTrackById(trackId) == null && state.playOrder[state.currentIndex] != null &&
      state.baseQueue[state.playOrder[state.currentIndex]] === trackId;
    const idxInBase = state.baseQueue.indexOf(trackId);
    if(idxInBase > -1){
      const removedOrderIdx = state.playOrder.indexOf(idxInBase);
      state.baseQueue.splice(idxInBase, 1);
      state.playOrder = state.playOrder.filter(i => i !== idxInBase).map(i => i > idxInBase ? i-1 : i);
      if(removedOrderIdx > -1 && removedOrderIdx <= state.currentIndex){
        state.currentIndex = Math.max(0, state.currentIndex - 1);
      }
      if(wasCurrent){ audio.pause(); if(state.baseQueue.length) loadAndPlayCurrent(); }
    }
  }
}
