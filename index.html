  return `<button class="back-home-btn" data-action="nav-home">${ICONS.back}<span>Back to Home</span></button>`;
}

function renderHome(){
  const hasContent = state.tracks.length > 0;
  const recentIds = getRecentTrackIds();
  const top25Ids = getTop25TrackIds();
  return `
    <div class="topbar">
      <div class="serif" style="font-size:20px;font-weight:650;letter-spacing:-0.01em;">Spindle</div>
      <div style="display:flex;gap:8px;">
        <button class="icon-btn" data-action="nav-search" aria-label="Search">${ICONS.search}</button>
        <button class="icon-btn" data-action="nav-settings" aria-label="Settings">${ICONS.settings}</button>
      </div>
    </div>
    <div class="home-hero">
      <p class="eyebrow">Your library, on wax</p>
      <h1>What are we<br/>spinning today?</h1>
      <p>Upload the MP3s already on your phone, drop them into playlists, and pick up right where the needle left off.</p>
    </div>
    <div class="action-row">
      <button class="pill-btn primary" data-action="trigger-upload">${ICONS.plusSong}<span>Add Songs</span></button>
      <button class="pill-btn" data-action="open-create-playlist">${ICONS.plusList}<span>New Playlist</span></button>
    </div>
    <div class="action-row" style="padding-top:0;padding-bottom:6px;">
      <button class="pill-btn" data-action="trigger-zip-upload">${ICONS.archive}<span>Import ZIP</span></button>
      <button class="pill-btn" data-action="trigger-folder-upload">${ICONS.folder}<span>Import Folder</span></button>
    </div>

    <div class="section">
      <div class="section-head"><h2>Your Library</h2></div>
      <button class="all-songs-card" data-action="nav-playlist" data-id="all" style="width:100%;">
        <div class="all-songs-art" style="background-image:url('./media/card-all.jpg');"></div>
        <div class="meta">
          <strong>All Songs</strong>
          <span>${state.tracks.length} track${state.tracks.length===1?'':'s'}</span>
        </div>
      </button>
      ${recentIds.length ? `
        <button class="all-songs-card" data-action="nav-playlist" data-id="recent" style="width:100%;margin-top:10px;">
          <div class="all-songs-art" style="background-image:url('./media/card-recent.jpg');"></div>
          <div class="meta">
            <strong>Recently Played</strong>
            <span>${recentIds.length} track${recentIds.length===1?'':'s'}</span>
          </div>
        </button>
      ` : ''}
      ${top25Ids.length ? `
        <button class="all-songs-card" data-action="nav-playlist" data-id="top25" style="width:100%;margin-top:10px;">
          <div class="all-songs-art" style="background-image:url('./media/card-top25.jpg');"></div>
          <div class="meta">
            <strong>Top 25 Most Played</strong>
            <span>${top25Ids.length} track${top25Ids.length===1?'':'s'}</span>
          </div>
        </button>
      ` : ''}
      ${hasContent ? `
        <button class="all-songs-card" data-action="nav-playlist" data-id="recently-added" style="width:100%;margin-top:10px;">
          <div class="all-songs-art" style="background-image:url('./media/card-added.jpg');"></div>
          <div class="meta">
            <strong>Recently Added</strong>
            <span>${Math.min(25, state.tracks.length)} track${Math.min(25, state.tracks.length)===1?'':'s'}</span>
          </div>
        </button>
      ` : ''}
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Playlists</h2>
        <span class="count">${state.playlists.length}</span>
      </div>
      ${state.playlists.length ? `
        <div class="playlist-grid">
          ${state.playlists.map(renderPlaylistCard).join('')}
        </div>
      ` : `
        <div class="empty-state" style="padding:30px 10px;">
          <p style="margin:0;">No playlists yet \u2014 group your favorites together.</p>
        </div>
      `}
    </div>
    ${!hasContent ? '' : ''}
  `;
}
function renderSearch(){
  const q = state.search.trim();
  const results = q ? state.tracks.filter(t => matchesSearch(t, q)) : [];
  const matchingPlaylists = q ? state.playlists.filter(p => p.name.toLowerCase().includes(q.toLowerCase())) : [];
  return `
    <div class="topbar">${backHomeBtn()}<div style="width:42px;"></div></div>
    <div style="padding:4px 20px 0;">
      <div class="search-input-wrap">
        ${ICONS.search}
        <input type="text" id="search-input" placeholder="Search songs, artists, albums, playlists\u2026" value="${escapeHtml(state.search)}" data-action="search-input" autocomplete="off" autofocus>
      </div>
    </div>
    ${!q ? `
      <div class="empty-state">${ICONS.search}<h3>Search your library</h3><p>Find songs by title, artist, or album, or jump to a playlist.</p></div>
    ` : `
      ${matchingPlaylists.length ? `
        <div class="section" style="padding-top:16px;">
          <div class="section-head"><h2 style="font-size:15px;">Playlists</h2></div>
          <div class="playlist-grid">${matchingPlaylists.map(renderPlaylistCard).join('')}</div>
        </div>
      ` : ''}
      <div class="section" style="padding-top:16px;">
        <div class="section-head"><h2 style="font-size:15px;">Songs${results.length ? ' (' + results.length + ')' : ''}</h2></div>
        ${results.length ? `
          <div class="track-list">${results.map((t,i)=> renderTrackRow(t, i, 'all', false)).join('')}</div>
        ` : `<p style="padding:0 20px;color:var(--text-faint);font-size:13.5px;">No matches for \u201c${escapeHtml(q)}\u201d.</p>`}
      </div>
    `}
  `;
}

function renderPlaylistCard(pl){
  return `
    <button class="playlist-card" data-action="nav-playlist" data-id="${pl.id}">
      <div class="playlist-cover">
        ${pl.coverUrl ? `<img src="${escapeHtml(pl.coverUrl)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='&lt;svg class=&quot;fallback-icon&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.6&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;2.4&quot; fill=&quot;currentColor&quot;/&gt;&lt;/svg&gt;'">` : `<svg class="fallback-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">${ICONS.disc.replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>`}
      </div>
      <div class="pinfo">
        <strong>${escapeHtml(pl.name)}</strong>
        <span>${pl.trackIds.length} track${pl.trackIds.length===1?'':'s'}</span>
      </div>
    </button>
  `;
}

function renderPlaylistDetail(){
  const cid = state.currentPlaylistId;
  const isAll = cid === 'all';
  const isRecent = cid === 'recent';
  const isTop25 = cid === 'top25';
  const isRecentlyAdded = cid === 'recently-added';
  const isSmart = isRecent || isTop25 || isRecentlyAdded;
  const pl = (isAll || isSmart) ? null : getPlaylistById(cid);
  if(!isAll && !isSmart && !pl){
    return `<div class="topbar">${backHomeBtn()}</div><div class="empty-state"><h3>Playlist not found</h3></div>`;
  }

  let trackIds, name, kicker, headerIcon;
  const recentEntries = isRecent ? getRecentPlayEntries() : null;
  const playedAtByTrack = isRecent ? new Map(recentEntries.map(e => [e.trackId, e.playedAt])) : null;

  if(isAll){ trackIds = state.tracks.map(t=>t.id); name = 'All Songs'; kicker = 'Library'; headerIcon = ICONS.disc; }
  else if(isRecent){ trackIds = recentEntries.map(e=>e.trackId); name = 'Recently Played'; kicker = 'History'; headerIcon = ICONS.history; }
  else if(isTop25){ trackIds = getTop25TrackIds(); name = 'Top 25 Most Played'; kicker = 'Smart Playlist'; headerIcon = ICONS.sparkle; }
  else if(isRecentlyAdded){ trackIds = getRecentlyAddedTrackIds(); name = 'Recently Added'; kicker = 'Smart Playlist'; headerIcon = ICONS.sparkle; }
  else { trackIds = pl.trackIds; name = pl.name; kicker = 'Playlist'; headerIcon = ICONS.disc; }

  let tracks = trackIds.map(id => getTrackById(id)).filter(Boolean);
  const canSort = isAll || (!isSmart && pl); // sorting is view-only and only makes sense for a list you don't already trust the order of
  if(canSort && state.sortBy !== 'default') tracks = sortTracks(tracks, state.sortBy);

  const cover = (isAll || isSmart) ? null : pl.coverUrl;
  const isActiveContext = state.queueContextId === cid;
  const canEdit = !isAll && !isSmart;
  const canAdd = !isSmart; // smart lists derive their contents automatically, no manual add

  return `
    <div class="topbar">
      ${backHomeBtn()}
      ${canEdit ? `<button class="icon-btn" data-action="open-edit-playlist" data-id="${pl.id}" aria-label="Edit playlist">${ICONS.edit}</button>` : ''}
    </div>
    <div class="pl-header">
      <div class="pl-cover-lg">
        ${cover ? `<img src="${escapeHtml(cover)}" alt="" onerror="this.parentElement.innerHTML='&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;1.4&quot;&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;9&quot;/&gt;&lt;circle cx=&quot;12&quot; cy=&quot;12&quot; r=&quot;2.4&quot; fill=&quot;currentColor&quot;/&gt;&lt;/svg&gt;'">` : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" width="40" height="40">${headerIcon.replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>`}
      </div>
      <div class="pl-title-wrap">
        <p class="pl-kicker">${kicker}</p>
        <h1>${escapeHtml(name)}</h1>
        <div class="sub">${tracks.length} track${tracks.length===1?'':'s'}</div>
      </div>
    </div>
    <div class="pl-actions">
      <button class="round-play-btn" data-action="play-all" data-id="${cid}" aria-label="Play">
        ${isActiveContext && state.isPlaying ? ICONS.pause : ICONS.play}
      </button>
      <button class="pill-btn" data-action="shuffle-all" data-id="${cid}">${ICONS.shuffle}<span>Shuffle</span></button>
      ${canAdd ? `<button class="pill-btn" data-action="${isAll ? 'trigger-upload' : 'open-add-songs'}" data-id="${cid}">${ICONS.plusSong}<span>Add</span></button>` : ''}
    </div>
    ${canSort && tracks.length > 1 ? `
      <div class="sort-row">
        <span>Sort</span>
        <select class="sort-select" data-action="sort-select">
          ${Object.entries(SORT_LABELS).map(([k,label]) => `<option value="${k}" ${state.sortBy===k?'selected':''}>${label}</option>`).join('')}
        </select>
      </div>
    ` : ''}
    ${tracks.length ? `
      <div class="track-list">
        ${tracks.map((t, i) => renderTrackRow(t, i, cid, canEdit, isRecent ? formatRelativeTime(playedAtByTrack.get(t.id)) : null)).join('')}
      </div>
    ` : `
      <div class="empty-state">
        ${isSmart ? ICONS.sparkle : ICONS.disc}
        <h3>${isRecent ? 'Nothing played yet' : isTop25 ? 'No plays yet' : isRecentlyAdded ? 'No songs yet' : 'Nothing here yet'}</h3>
        <p>${isRecent ? 'Songs you play will show up here.' : isTop25 ? 'Play some songs and your favorites will show up here.' : isRecentlyAdded ? 'Songs you add will show up here.' : isAll ? 'Add MP3 files from your device to start building your library.' : 'Add songs from your library to fill this playlist.'}</p>
        ${canAdd ? `<button class="pill-btn primary" style="display:inline-flex;" data-action="${isAll ? 'trigger-upload' : 'open-add-songs'}" data-id="${cid}">${ICONS.plusSong}<span>${isAll ? 'Add Songs' : 'Add from Library'}</span></button>` : ''}
      </div>
    `}
  `;
}

function renderTrackRow(t, index, contextId, allowRemove, metaRight){
  const isCurrent = state.queueContextId === contextId && state.baseQueue[state.playOrder[state.currentIndex]] === t.id;
  const thumb = coverArtOrNull(t)
    ? `<img class="track-thumb" src="${t.coverArt}" alt="">`
    : `<div class="track-thumb-fallback">${ICONS.note}</div>`;
  const numCell = isCurrent
    ? `<div class="eq">${state.isPlaying ? '<span style="animation-delay:0s"></span><span style="animation-delay:.15s"></span><span style="animation-delay:.3s"></span>' : '<span style="height:3px"></span><span style="height:3px"></span><span style="height:3px"></span>'}</div>`
    : (index+1);
  return `
    <div class="track-row ${isCurrent?'active-track':''}" data-action="play-track" data-id="${t.id}" data-context="${contextId}">
      <div class="track-num">${numCell}</div>
      ${thumb}
      <div class="track-meta">
        <strong>${escapeHtml(t.title)}</strong>
        <span>${escapeHtml(t.artist)}</span>
      </div>
      <div class="track-dur">${metaRight != null ? escapeHtml(metaRight) : formatTime(t.duration)}</div>
      <button class="track-menu-btn" data-action="track-menu" data-id="${t.id}" data-context="${contextId}" data-removable="${allowRemove?'1':'0'}" aria-label="More options">${ICONS.dots}</button>
    </div>
  `;
}

function renderLyricsPanel(track){
  const parsed = track.lyricsLRC ? parseLRC(track.lyricsLRC) : [];
  if(parsed.length){
    return `
      <div class="lyrics-panel">
        <div class="lyrics-scroll" id="lyrics-scroll">
          <div class="lyrics-pad"></div>
          ${parsed.map(line => `<p class="lyrics-line" data-time="${line.time}">${escapeHtml(line.text) || '\u2022'}</p>`).join('')}
          <div class="lyrics-pad"></div>
        </div>
        <button class="pill-btn" style="width:100%;margin-top:10px;" data-action="trigger-lrc-upload">${ICONS.lyrics}<span>Replace Lyrics</span></button>
      </div>
    `;
  }
  if(track.embeddedLyrics){
    return `
      <div class="lyrics-panel">
        <div class="lyrics-scroll unsynced">
          <p class="lyrics-line active">${escapeHtml(track.embeddedLyrics)}</p>
        </div>
        <p class="lyrics-hint">These lyrics aren\u2019t time-synced.</p>
        <div style="display:flex;gap:8px;width:100%;">
          <button class="pill-btn" style="flex:1;" data-action="find-lyrics-online">${ICONS.search}<span>Find Synced Online</span></button>
          <button class="pill-btn" style="flex:1;" data-action="trigger-lrc-upload">${ICONS.lyrics}<span>Upload .lrc</span></button>
        </div>
      </div>
    `;
  }
  return `
    <div class="lyrics-panel">
      <div class="empty-state" style="padding:26px 16px;">
        ${ICONS.lyrics}
        <h3>No lyrics yet</h3>
        <p>Look them up automatically, or upload a matching .lrc file yourself.</p>
        <div style="display:flex;gap:8px;width:100%;margin-top:4px;">
          <button class="pill-btn primary" style="flex:1;" data-action="find-lyrics-online">${ICONS.search}<span>Find Online</span></button>
          <button class="pill-btn" style="flex:1;" data-action="trigger-lrc-upload">${ICONS.lyrics}<span>Upload .lrc</span></button>
        </div>
      </div>
    </div>
  `;
}

function getCurrentPlayingTrack(){
  if(state.currentIndex < 0 || state.currentIndex >= state.playOrder.length) return null;
  const baseIndex = state.playOrder[state.currentIndex];
  const trackId = state.baseQueue[baseIndex];
  return getTrackById(trackId);
}

function renderNowPlaying(){
  const track = getCurrentPlayingTrack();
  if(!track){
    return `<div class="topbar">${backHomeBtn()}</div><div class="empty-state"><h3>Nothing playing</h3><p>Pick a song from your library to get started.</p></div>`;
  }
  const art = coverArtOrNull(track);
  return `
    <div class="now-playing-view">
      <div class="topbar">
        ${backHomeBtn()}
        <div style="display:flex;gap:8px;">
          <button class="icon-btn ${state.showLyrics?'on':''}" data-action="toggle-lyrics-view" aria-label="Lyrics">${ICONS.lyrics}</button>
          <button class="icon-btn" data-action="open-eq-modal" aria-label="Sound settings">${ICONS.sliders}</button>
        </div>
      </div>
      <div class="np-stage">
        ${state.showLyrics ? renderLyricsPanel(track) : `
        <div class="vinyl ${state.isPlaying?'spinning':''}">
          <div class="disc">
            <div class="disc-body">
              <div class="label">
                ${art ? `<img src="${art}" alt="">` : `<svg class="note-icon" viewBox="0 0 24 24" fill="currentColor">${ICONS.note.replace(/<svg[^>]*>|<\/svg>/g,'')}</svg>`}
              </div>
            </div>
          </div>
          <div class="spindle-hole"></div>
        </div>
        <div class="np-title">
          <h1>${escapeHtml(track.title)}</h1>
          <p>${escapeHtml(track.artist)}</p>
        </div>
        `}
      </div>

      <div class="visualizer" id="visualizer-bars">
        ${Array.from({length:24}).map(()=>'<span></span>').join('')}
      </div>

      <div class="np-seek">
        <input type="range" id="seek-range" min="0" max="100" step="0.1" value="0" data-action="seek-range" aria-label="Seek">
        <div class="seek-row" style="margin-top:8px;">
          <span class="time-label" id="seek-current-label">0:00</span>
          <div style="flex:1;"></div>
          <span class="time-label end" id="seek-end-label">${formatTime(track.duration)}</span>
        </div>
      </div>

      <div class="np-controls">
        <button class="ctrl-btn ${state.shuffle?'on':''}" data-action="toggle-shuffle" aria-label="Shuffle">${ICONS.shuffle}</button>
        <button class="ctrl-btn skip" data-action="prev-track" aria-label="Previous">${ICONS.prev}</button>
        <button class="np-play-btn" data-action="toggle-play" aria-label="Play or pause">
          <span data-role="play-pause-icon">${state.isPlaying ? ICONS.pause : ICONS.play}</span>
        </button>
        <button class="ctrl-btn skip" data-action="next-track" aria-label="Next">${ICONS.next}</button>
        <button class="ctrl-btn ${state.repeat!=='off'?'on':''}" data-action="cycle-repeat" aria-label="Repeat">${state.repeat==='one'?ICONS.repeatOne:ICONS.repeat}</button>
      </div>

      <div class="np-volume">
        ${ICONS.vol}
        <input type="range" id="volume-range" min="0" max="1" step="0.01" value="${state.volume}" data-action="volume-range" aria-label="Volume">
      </div>
    </div>
  `;
}

function renderSettings(){
  const totalTracks = state.tracks.length;
  const totalPlaylists = state.playlists.length;
  const totalSeconds = state.tracks.reduce((s,t)=> s + (t.duration||0), 0);
  const h = Math.floor(totalSeconds/3600), m = Math.floor((totalSeconds%3600)/60);
  const totalPlays = state.tracks.reduce((s,t)=> s + (t.playCount||0), 0);
  const tracksPlayed = state.tracks.filter(t => (t.playCount||0) > 0).length;
  const mostPlayed = state.tracks
    .filter(t => (t.playCount||0) > 0)
    .sort((a,b) => (b.playCount||0) - (a.playCount||0))
    .slice(0, 5);
  return `
    <div class="topbar">${backHomeBtn()}<div style="width:42px;"></div></div>
    <div class="home-hero"><h1 style="font-size:24px;">Library & Stats</h1></div>
    <div class="settings-list">
      <div class="settings-row"><span class="s-label">Songs</span><span class="value">${totalTracks}</span></div>
      <div class="settings-row"><span class="s-label">Playlists</span><span class="value">${totalPlaylists}</span></div>
      <div class="settings-row"><span class="s-label">Library duration</span><span class="value">${h}h ${m}m</span></div>
      <div class="settings-row"><span class="s-label">Total plays</span><span class="value">${totalPlays}</span></div>
      <div class="settings-row"><span class="s-label">Songs played</span><span class="value">${tracksPlayed} / ${totalTracks}</span></div>
      <div class="settings-row"><span class="s-label">Playback volume</span><span class="value">${Math.round(state.volume*100)}%</span></div>
    </div>
    ${mostPlayed.length ? `
      <div class="section" style="padding-top:6px;">
        <div class="section-head"><h2 style="font-size:16px;">Most Played</h2></div>
        <div class="track-list" style="padding:0;">
          ${mostPlayed.map((t,i) => renderTrackRow(t, i, 'all', false, t.playCount + (t.playCount===1?' play':' plays'))).join('')}
        </div>
      </div>
    ` : ''}
    <div class="section" style="padding-top:6px;">
      <div class="section-head"><h2 style="font-size:16px;">Background</h2></div>
      <div class="bg-mode-row">
        <button class="bg-mode-btn ${state.background.mode==='scenery'?'active':''}" data-action="set-bg-mode" data-mode="scenery">${ICONS.disc}<span>Animated</span></button>
        <button class="bg-mode-btn ${state.background.mode==='solid'?'active':''}" data-action="set-bg-mode" data-mode="solid"><span class="bg-mode-swatch" style="background:${escapeHtml(state.background.color)};"></span><span>Solid Color</span></button>
        <button class="bg-mode-btn ${state.background.mode==='photo'?'active':''}" data-action="set-bg-mode" data-mode="photo">${ICONS.image}<span>Photo / Video</span></button>
        <button class="bg-mode-btn ${state.background.mode==='stock'?'active':''}" data-action="set-bg-mode" data-mode="stock">${ICONS.disc}<span>Stocked Backgrounds</span></button>
      </div>
      ${state.background.mode === 'stock' && window.__spindleBg ? `
        <div class="stock-grid">
          ${window.__spindleBg.stock.map(it => `
            <button class="stock-item ${window.__spindleBg.getStockId()===it.id?'active':''}" data-action="set-bg-stock" data-id="${it.id}" style="background-image:url('${it.thumb}');" aria-label="${escapeHtml(it.label)}"><span>${escapeHtml(it.label)}</span></button>
          `).join('')}
        </div>
      ` : ''}
      ${state.background.mode === 'solid' ? `
        <div class="bg-color-row">
          <input type="color" data-action="bg-color-input" value="${escapeHtml(state.background.color)}">
          <span>Tap the swatch to pick a color</span>
        </div>
      ` : ''}
      ${state.background.mode === 'photo' ? `
        <button class="pill-btn" style="width:100%;margin-top:12px;" data-action="trigger-bg-photo-upload">${ICONS.image}<span>${state.background.photoObjectURL ? (state.background.photoIsVideo ? 'Change Video or Photo' : 'Change Photo or Video') : 'Choose Photo or Video'}</span></button>
      ` : ''}
    </div>
    <div style="padding:20px 20px 0;">
      <button class="danger-btn" data-action="clear-all-data">Erase All Songs, Playlists & History</button>
    </div>
  `;
}

function renderMiniPlayer(){
  if(!state.baseQueue.length) return '';
  const baseIndex = state.playOrder[state.currentIndex];
  const trackId = state.baseQueue[baseIndex];
  const track = getTrackById(trackId);
  if(!track) return '';
  const art = coverArtOrNull(track);
  const discSvg = `
    <div class="mini-disc ${state.isPlaying?'spinning':''}" style="filter:none;">
      <div class="disc" style="width:40px;height:40px;">
        <div class="disc-body" style="width:40px;height:40px;">
          <div class="label" style="width:16px;height:16px;">
            ${art ? `<img src="${art}" alt="">` : ''}
          </div>
        </div>
      </div>
    </div>`;
  return `
    <div class="mini-player" id="mini-player-root">
      <div class="mini-player-inner" data-action="nav-now-playing">
        <div class="mini-progress"><div class="mini-progress-fill" id="mini-progress-fill"></div></div>
        <div class="mini-player-row">
          ${discSvg}
          <div class="mini-meta">
            <strong>${escapeHtml(track.title)}</strong>
            <span>${escapeHtml(track.artist)}</span>
          </div>
          <div class="mini-controls">
            <button class="mini-btn" data-action="prev-track" data-stop="1" aria-label="Previous">${ICONS.prev}</button>

              <span data-role="play-pause-icon">${state.isPlaying ? ICONS.pause : ICONS.play}</span>
            </button>

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.view === 'home') html = renderHome();
  else if(state.view === 'playlist') html = renderPlaylistDetail();
  else if(state.view === 'now-playing') html = renderNowPlaying();
  else if(state.view === 'settings') html = renderSettings();
  else if(state.view === 'search') html = renderSearch();
  html += renderMiniPlayer();
  app.innerHTML = `<div>${html}</div>`;
  updateProgressUI();
  const seekEl = document.getElementById('seek-range');
  if(seekEl){
    const dur = audio.duration || 0;
    const pct = dur ? (audio.currentTime/dur)*100 : 0;
    seekEl.style.setProperty('--fill', pct + '%');
  }
}

/* Navigational repaint: gives screen changes a "going deeper" / "going back" feel.
   Uses the native View Transitions API where supported (smooth, GPU-composited),
   and falls back to a plain CSS slide-in for browsers that don't support it. */
function reducedMotionPreferred(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
function transitionRender(direction){
  const app = document.getElementById('app');
  if(typeof document.startViewTransition === 'function' && !reducedMotionPreferred()){
    document.documentElement.setAttribute('data-nav-dir', direction);
    try{
      const t = document.startViewTransition(()=> render());
      t.finished.catch(()=>{});
      return;
    }catch(e){ /* fall through to manual fallback below */ }
  }
  render();
  if(!app) return;
  app.classList.remove('slide-fwd','slide-back');
  void app.offsetHeight; // force reflow so the animation replays
  app.classList.add(direction === 'backward' ? 'slide-back' : 'slide-fwd');
}

document.addEventListener('click', async (e)=>{
  const modalOverlay = e.target.closest('.modal-overlay');
  const stopEl = e.target.closest('[data-stop]');
  if(modalOverlay && !stopEl){ closeModal(); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    case 'nav-home': state.view = 'home'; transitionRender('backward'); break;
    case 'nav-settings': state.view = 'settings'; transitionRender('forward'); break;
    case 'nav-search': state.view = 'search'; transitionRender('forward'); break;
    case 'nav-now-playing':
      if(state.baseQueue.length){ state.view = 'now-playing'; transitionRender('forward'); if(state.isPlaying) startVisualizerLoop(); }
      break;
    case 'nav-playlist': state.currentPlaylistId = id; state.view = 'playlist'; transitionRender('forward'); break;

    case 'trigger-upload': document.getElementById('file-input-audio').click(); break;
    case 'trigger-upload-for-playlist':
      state.pendingUploadPlaylistId = id;
      document.getElementById('file-input-audio').click();
      break;
    case 'trigger-zip-upload': document.getElementById('file-input-zip').click(); break;
    case 'trigger-folder-upload': document.getElementById('file-input-folder').click(); break;

    case 'open-create-playlist': openCreatePlaylistModal(); break;
    case 'open-eq-modal': openEqModal(); break;
    case 'toggle-lyrics-view':
      state.showLyrics = !state.showLyrics;
      render();
      updateLyricsUI();
      if(state.showLyrics){ const t = getCurrentPlayingTrack(); if(t) autoFetchLyrics(t); }
      break;
    case 'trigger-lrc-upload': document.getElementById('file-input-lrc').click(); break;
    case 'find-lyrics-online': {
      const track = getCurrentPlayingTrack();
      if(track) fetchLyricsOnline(track);
      break;
    }
    case 'toggle-eq': {
      state.eq.enabled = !state.eq.enabled;
      applyEqToFilters();
      persistEqSettings();
      openModalHtml(renderEqModalBody());
      break;
    }
    case 'apply-eq-preset': {
      const presetKey = el.dataset.preset;
      const preset = EQ_PRESETS[presetKey];
      if(preset){
        state.eq.bands = preset.bands.slice();
        state.eq.preset = presetKey;
        applyEqToFilters();
        persistEqSettings();
        openModalHtml(renderEqModalBody());
      }
      break;
    }
    case 'toggle-preserve-pitch': {
      setPreservesPitch(!state.preservesPitch);
      openModalHtml(renderEqModalBody());
      break;
    }
    case 'open-edit-playlist': openEditPlaylistModal(id); break;
    case 'close-modal': closeModal(); break;

    case 'pick-cover-image': document.getElementById('file-input-cover').click(); break;

    case 'set-bg-mode': {
      const mode = el.dataset.mode;
      if(!mode || mode === state.background.mode) break;
      if(mode === 'photo' && !state.background.photoObjectURL){
        document.getElementById('file-input-bg-photo').click();
        break;
      }
      state.background.mode = mode;
      try{ localStorage.setItem('spindle-bg-mode', mode); }catch(err){}
      if(window.__spindleBg){
        window.__spindleBg.setMode(mode, state.background.color);
        if(mode === 'photo' && state.background.photoObjectURL) window.__spindleBg.setPhotoUrl(state.background.photoObjectURL, state.background.photoIsVideo);
      }
      render();
      break;
    }
    case 'set-bg-stock': {
      const id = el.dataset.id;
      if(!id || !window.__spindleBg) break;
      state.background.mode = 'stock';
      try{ localStorage.setItem('spindle-bg-mode', 'stock'); }catch(err){}
      window.__spindleBg.setMode('stock', state.background.color);
      window.__spindleBg.setStock(id);
      render();
      break;
    }
    case 'trigger-bg-photo-upload': document.getElementById('file-input-bg-photo').click(); break;

    case 'save-new-playlist': {
      const nameEl = document.getElementById('modal-playlist-name');
      const urlEl = document.getElementById('modal-cover-url');
      const name = (nameEl?.value || '').trim() || 'New Playlist';
      const cover = editingPlaylistDraftCover || (urlEl?.value || '').trim() || null;
      const pl = await createPlaylist(name, cover);
      closeModal();
      state.currentPlaylistId = pl.id;
      state.view = 'playlist';
      render();
      break;
    }
    case 'save-edit-playlist': {
      const nameEl = document.getElementById('modal-playlist-name');
      const urlEl = document.getElementById('modal-cover-url');
      const name = (nameEl?.value || '').trim() || 'Untitled Playlist';
      const cover = editingPlaylistDraftCover || (urlEl?.value || '').trim() || null;
      await updatePlaylist(id, { name, coverUrl: cover });
      closeModal();
      render();
      break;
    }
    case 'delete-playlist-confirm': {
      const pl = getPlaylistById(id);
      if(pl && confirm('Delete "' + pl.name + '"? Songs stay in your library.')){
        await deletePlaylist(id);
        closeModal();
        state.view = 'home';
        render();
      }
      break;
    }
    case 'duplicate-playlist': {
      const copy = await duplicatePlaylist(id);
      closeModal();
      if(copy){
        state.currentPlaylistId = copy.id;
        state.view = 'playlist';
        transitionRender('forward');
        showToast('Playlist duplicated');
      }
      break;
    }

    case 'open-add-songs': openAddSongsModal(id); break;
    case 'confirm-add-songs': {
      const picked = Array.from(document.querySelectorAll('#track-pick-list .track-pick-row.checked')).map(r => r.dataset.pickTrack);
      await addTracksToPlaylist(id, picked);
      const pl = getPlaylistById(id);
      if(pl) pl.trackIds = pl.trackIds; // already updated in place
      closeModal();
      render();
      break;
    }

    case 'track-menu': openTrackMenuModal(id, el.dataset.context, el.dataset.removable === '1'); break;
    case 'remove-from-playlist': {
      await removeTrackFromPlaylist(el.dataset.context, id);
      closeModal();
      render();
      break;
    }
    case 'delete-track-confirm': {
      const t = getTrackById(id);
      if(t && confirm('Permanently delete "' + t.title + '" from your device library?')){
        await deleteTrackPermanently(id);
        closeModal();
        render();
      }
      break;
    }

    case 'play-all': {
      const pid = id;
      if(state.queueContextId === pid && state.baseQueue.length){ togglePlayPause(); }
      else{ playAllFromContext(pid, false); }
      render();
      break;
    }
    case 'shuffle-all': {
      state.shuffle = true;
      playAllFromContext(id, true);
      break;
    }
    case 'play-track': playTrackInContext(id, el.dataset.context); break;

    case 'toggle-play': togglePlayPause(); break;
    case 'next-track': advanceTrack(false); break;
    case 'prev-track': prevTrack(); break;
    case 'toggle-shuffle': toggleShuffle(); break;
    case 'cycle-repeat': cycleRepeat(); break;

    case 'clear-all-data': {
      if(confirm('This will permanently erase every song, playlist, and play history from this device. Continue?')){
        audio.pause();
        if(state.currentObjectURL){ URL.revokeObjectURL(state.currentObjectURL); state.currentObjectURL = null; }
        await idbClearAll();
        Object.assign(state, {
          tracks:[], playlists:[], history:[], baseQueue:[], playOrder:[], currentIndex:-1,
          queueContextId:null, isPlaying:false, view:'home', currentPlaylistId:null,
        });
        showToast('Library erased.');
        render();
      }
      break;
    }
  }

  // toggle checkbox rows inside add-songs modal
  const pickRow = e.target.closest('[data-pick-track]');
  if(pickRow){
    pickRow.classList.toggle('checked');
    const box = pickRow.querySelector('.checkbox');
    box.innerHTML = pickRow.classList.contains('checked') ? ICONS.check : '';
  }
});

document.addEventListener('input', (e)=>{
  const action = e.target.dataset && e.target.dataset.action;
  if(action === 'seek-range'){
    state.scrubbing = true;
    const pct = parseFloat(e.target.value);
    e.target.style.setProperty('--fill', pct + '%');
    const dur = audio.duration || 0;
    const curLabel = document.getElementById('seek-current-label');
    if(curLabel) curLabel.textContent = formatTime((pct/100) * dur);
  } else if(action === 'volume-range'){
    const v = parseFloat(e.target.value);
    state.volume = v;
    audio.volume = v;
    try{ localStorage.setItem('spindle-volume', String(v)); }catch(e){}
  } else if(action === 'cover-url-input'){
    editingPlaylistDraftCover = null;
    const preview = document.getElementById('modal-cover-preview');
    const val = e.target.value.trim();
    if(preview){
      preview.innerHTML = val ? `<img src="${escapeHtml(val)}" alt="" onerror="this.parentElement.innerHTML='${ICONS.image.replace(/'/g,"\\'")}'">` : ICONS.image;
    }
  } else if(action === 'bg-color-input'){
    if(window.__spindleBg) window.__spindleBg.setMode('solid', e.target.value);
  } else if(action === 'search-input'){
    state.search = e.target.value;
    const cursorPos = e.target.selectionStart;
    render();
    const input = document.getElementById('search-input');
    if(input){
      input.focus();
      try{ input.setSelectionRange(cursorPos, cursorPos); }catch(err){}
    }
  } else if(action === 'eq-band'){
    const idx = parseInt(e.target.dataset.index, 10);
    const db = parseFloat(e.target.value);
    if(!isNaN(idx) && !isNaN(db)){
      state.eq.bands[idx] = db;
      state.eq.preset = 'custom';
      if(eqFilters[idx]) eqFilters[idx].gain.value = state.eq.enabled ? db : 0;
      const label = document.getElementById('eq-band-label-' + idx);
      if(label) label.textContent = (db>0?'+':'') + db + 'dB';
    }
  } else if(action === 'playback-rate'){
    const rate = parseFloat(e.target.value);
    if(!isNaN(rate)){
      state.playbackRate = rate;
      audio.playbackRate = rate;
      if(crossfadeAudio) crossfadeAudio.playbackRate = rate;
      const label = document.getElementById('playback-rate-label');
      if(label) label.textContent = rate.toFixed(2) + 'x';
    }
  } else if(action === 'crossfade-seconds'){
    const secs = parseInt(e.target.value, 10);
    if(!isNaN(secs)){
      state.crossfadeSeconds = secs;
      const label = document.getElementById('crossfade-seconds-label');
      if(label) label.textContent = secs === 0 ? 'Off' : secs + 's';
    }
  }
});

document.addEventListener('change', (e)=>{
  const action = e.target.dataset && e.target.dataset.action;
  if(action === 'seek-range'){
    if(crossfadeInProgress) cancelCrossfade();
    state.scrubbing = false;
    const pct = parseFloat(e.target.value);
    const dur = audio.duration || 0;
    if(dur) audio.currentTime = (pct/100) * dur;
  } else if(action === 'bg-color-input'){
    const c = e.target.value;
    state.background.color = c;
    try{ localStorage.setItem('spindle-bg-color', c); }catch(err){}
  } else if(action === 'sort-select'){
    state.sortBy = e.target.value;
    render();
  } else if(action === 'eq-band'){
    persistEqSettings();
  } else if(action === 'playback-rate' || action === 'crossfade-seconds'){
    persistPlaybackSettings();
  }
});

document.getElementById('file-input-cover').addEventListener('change', (e)=>{

document.getElementById('file-input-bg-photo').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const isVideo = /^video\//.test(file.type) || /\.(mp4|webm|mov|m4v)$/i.test(file.name);
    if(!isVideo && !/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|jfif|avif)$/i.test(file.name)){
      showToast('Please pick a photo or a video.');
      return;
    }
    await idbPut('settings', { id:'bgPhoto', blob:file, isVideo:isVideo });
    if(state.background.photoObjectURL) URL.revokeObjectURL(state.background.photoObjectURL);
    const url = URL.createObjectURL(file);
    state.background.photoObjectURL = url;
    state.background.photoIsVideo = isVideo;
    state.background.mode = 'photo';
    try{ localStorage.setItem('spindle-bg-mode', 'photo'); }catch(err){}
    if(window.__spindleBg){
      window.__spindleBg.setMode('photo', state.background.color);
      window.__spindleBg.setPhotoUrl(url, isVideo);
    }
    showToast(isVideo ? 'Background video updated.' : 'Background photo updated.');
    render();
  }catch(err){
    console.error(err);
    showToast('Could not save that file.');
  }
});
document.getElementById('file-input-zip').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(file) handleZipSelected(file);
});
document.getElementById('file-input-folder').addEventListener('change', (e)=>{
  const files = Array.from(e.target.files || []); // copy first: clearing the input empties the live FileList
  e.target.value = '';
  if(files.length) handleFolderSelected(files);
});
document.getElementById('file-input-lrc').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  const track = getCurrentPlayingTrack();
  if(!track){ showToast('Nothing is playing to attach lyrics to.'); return; }
  try{
    const text = await file.text();
    if(!parseLRC(text).length){
      showToast('That file doesn\u2019t look like a valid .lrc \u2014 no timed lines found.');
      return;
    }
    const full = await idbGet('tracks', track.id);
    if(full){
      full.lyricsLRC = text;
      await idbPut('tracks', full);
    }
    track.lyricsLRC = text; // keep the light in-memory copy in sync too
    showToast('Lyrics added.');
    render();
    updateLyricsUI();
  }catch(err){
    console.error('Failed to read lyrics file', err);
    showToast('Couldn\u2019t read that lyrics file.');
  }
});

/* ---------- Global keyboard shortcuts ---------- */
document.addEventListener('keydown', (e)=>{
  // Ctrl/Cmd+F always focuses search, even while typing elsewhere, and never opens the browser's own find bar.
  if((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')){
    e.preventDefault();
    if(state.view !== 'search'){
      state.view = 'search';
      transitionRender('forward');
    }else{
      const input = document.getElementById('search-input');
      if(input) input.focus();
    }
    return;
  }

  const tag = (e.target && e.target.tagName || '').toLowerCase();
  const isTyping = tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable);
  if(isTyping) return; // don't hijack space/arrows/M while the user is actually typing

  if(e.key === ' ' || e.code === 'Space'){
    e.preventDefault();
    togglePlayPause();
  }else if(e.key === 'ArrowLeft'){
    e.preventDefault();
    if(audio.duration) audio.currentTime = Math.max(0, audio.currentTime - 5);
  }else if(e.key === 'ArrowRight'){
    e.preventDefault();
    if(audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
  }else if(e.key === 'm' || e.key === 'M'){
    e.preventDefault();
    toggleMute();
  }
});

window.addEventListener('beforeunload', ()=>{
  if(state.currentObjectURL) URL.revokeObjectURL(state.currentObjectURL);
  if(state.background.photoObjectURL) URL.revokeObjectURL(state.background.photoObjectURL);
});

/* ============================================================
   INIT
============================================================ */
async function init(){
  setupMediaSession();
  try{
    const savedVol = parseFloat(localStorage.getItem('spindle-volume'));
    if(!isNaN(savedVol)) state.volume = savedVol;
  }catch(e){}
  audio.volume = state.volume;
  loadEqSettings();
  loadPlaybackSettings();

  try{
    const [tracksRaw, playlists, historyRaw] = await Promise.all([idbGetAll('tracks'), idbGetAll('playlists'), idbGetAll('history')]);
    state.tracks = tracksRaw.map(t => { const light = Object.assign({}, t); delete light.fileBlob; return light; })
      .sort((a,b)=> (b.addedAt||0) - (a.addedAt||0));
    state.playlists = playlists.sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
    state.history = historyRaw.sort((a,b)=> (b.playedAt||0) - (a.playedAt||0));
  }catch(err){
    console.error('Failed to load library', err);
    showToast('Could not load your saved library.');
  }

  try{
    state.background.mode = localStorage.getItem('spindle-bg-mode') || 'scenery';
    state.background.color = localStorage.getItem('spindle-bg-color') || '#1a1025';
  }catch(e){}
  try{
    const saved = await idbGet('settings', 'bgPhoto');
    if(saved && saved.blob){
      const url = URL.createObjectURL(saved.blob);
      state.background.photoObjectURL = url;
      state.background.photoIsVideo = !!saved.isVideo || /^video\//.test(saved.blob.type || '');
      if(state.background.mode === 'photo' && window.__spindleBg){
        window.__spindleBg.setPhotoUrl(url, state.background.photoIsVideo);
      }
    } else if(state.background.mode === 'photo'){
      // Mode says photo but nothing is stored (shouldn't normally happen) — fall back safely.
      state.background.mode = 'scenery';
      try{ localStorage.setItem('spindle-bg-mode', 'scenery'); }catch(e){}
      if(window.__spindleBg) window.__spindleBg.setMode('scenery');
    }
  }catch(err){
    console.error('Failed to load background photo', err);
  }

  render();
}
init();

/* ---------- PWA: service worker + online/offline handling ---------- */
// A service worker can only register on a real http(s) origin, not on a page opened
// straight from disk \u2014 registration simply (and harmlessly) fails there, so this is
// safe to run unconditionally.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.warn('Service worker registration skipped (expected when running from a local file):', err);
    });
  });
}

// Local playback never touches the network, so going offline shouldn't interrupt anything
// that's already loaded \u2014 this just keeps the person informed, and is the hook any future
// online-only feature should check before it tries to reach the network.
window.addEventListener('offline', () => {
  showToast('You\u2019re offline \u2014 your library and playback keep working as normal.');
});
window.addEventListener('online', () => {
  showToast('Back online.');
});

})();
</script>
